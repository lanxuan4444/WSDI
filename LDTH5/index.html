<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LDTools Log Searcher</title>
<link rel="icon" href="Img/LDTLS.ico">
<style>
/* ==================== CSS 变量（主题色集中管理） ==================== */
:root{
  --bg:#f1f5f9;            /* 页面背景 */
  --card-bg:#ffffff;       /* 卡片背景 */
  --text:#0f172a;          /* 主文字 */
  --text-muted:#64748b;    /* 次要文字 */
  --text-light:#94a3b8;    /* 辅助文字 */
  --primary:#1a56db;       /* 蓝色主色 */
  --primary-light:#dbeafe;  /* 主色浅色 */
  --primary-dark:#1e40af;  /* 主色深色 */
  --border:#e2e8f0;        /* 边框 */
  --border-strong:#cbd5e1; /* 强边框 */
  --success:#16a34a;       /* 成功 */
  --failed:#dc2626;        /* 失败 */
  --partial:#ea580c;       /* 部分 */
  --skipped:#64748b;       /* 跳过 */
  --success-bg:#dcfce7;
  --failed-bg:#fee2e2;
  --partial-bg:#fed7aa;
  --skipped-bg:#e2e8f0;
  --highlight:#fef08a;     /* 搜索高亮黄底 */
  --highlight-text:#0f172a;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-hover:0 6px 16px rgba(0,0,0,.12);
  --shadow-lg:0 10px 40px rgba(0,0,0,.2);
  --radius:10px;
  --radius-sm:6px;
  --max-width:1100px;
}

/* ==================== 基础重置 ==================== */
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;}
pre{font-family:"Cascadia Code","Fira Code",Consolas,"Courier New",monospace;}

/* ==================== 容器 ==================== */
.container{
  max-width:var(--max-width);
  margin:0 auto;
  padding:0 16px;
}

/* ==================== 头部 ==================== */
.header{
  padding:24px 0 16px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
}
.header h1{
  font-size:1.5rem;
  font-weight:700;
  letter-spacing:-.02em;
}
.header h1 .accent{color:var(--primary);}
.logo-img{width:28px;height:28px;vertical-align:-4px;margin-right:6px;border-radius:4px;}
.header .stats{
  font-size:.85rem;
  color:var(--text-muted);
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.header .stats b{color:var(--text);font-weight:600;}

/* ==================== 工具栏 ==================== */
.toolbar{
  background:var(--card-bg);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 16px;
  margin-bottom:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  position:sticky;
  top:8px;
  z-index:50;
  border:1px solid var(--border);
}
.search-row{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
#searchInput{
  flex:1;
  min-width:160px;
  padding:9px 14px;
  border:1.5px solid var(--border-strong);
  border-radius:var(--radius-sm);
  font-size:.92rem;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  background:var(--bg);
}
#searchInput:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-light);
  background:#fff;
}
#searchInput::-webkit-search-cancel-button{cursor:pointer;}

/* 开关 Toggle */
/* [2026-08-20] hidden 属性强制生效（.toggle 的 display:inline-flex 会覆盖 UA 默认的 display:none） */
[hidden]{display:none !important;}

.toggle{
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
  font-size:.85rem;
  color:var(--text-muted);
}
.toggle input{display:none;}
.toggle-track{
  width:36px;
  height:20px;
  background:var(--border-strong);
  border-radius:10px;
  position:relative;
  transition:background .25s;
  flex-shrink:0;
}
.toggle-thumb{
  position:absolute;
  top:2px;left:2px;
  width:16px;height:16px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.toggle input:checked + .toggle-track{background:var(--primary);}
.toggle input:checked + .toggle-track .toggle-thumb{transform:translateX(16px);}
.toggle:hover .toggle-label{color:var(--text);}

/* 筛选行 */
.filter-row{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:space-between;
}
.date-group{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
/* 三段式日期组件（年/月/日独立段，滚轮悬停改该段） */
.date-seg-group{
  display:inline-flex;
  align-items:center;
  padding:2px 4px;
  border:1.5px solid var(--border-strong);
  border-radius:var(--radius-sm);
  background:var(--bg);
  transition:border-color .2s,box-shadow .2s;
}
.date-seg-group:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-light);
  background:#fff;
}
.date-seg-group .seg{
  width:2.1em;
  text-align:center;
  border:none;
  outline:none;
  background:transparent;
  font-size:.85rem;
  color:var(--text);
  padding:5px 2px;
  border-radius:4px;
  cursor:ns-resize;            /* 暗示可上下滚轮调节 */
  font-family:inherit;
  transition:background .15s,color .15s;
}
.date-seg-group .seg[data-unit="year"]{ width:3.2em; }
.date-seg-group .seg:hover,
.date-seg-group .seg:focus{
  background:var(--primary-light);
  color:var(--primary);
}
.date-seg-group .seg-unit{
  color:var(--text-light);
  font-size:.76rem;
  margin:0 1px;
  user-select:none;
}
.date-sep{color:var(--text-light);font-size:.9rem;user-select:none;}
.date-group .btn-mini{padding:7px 11px;}

/* 应用日期按钮（修改后高亮显现，点击才查询） */
.btn-apply-date{
  padding:6px 13px;
  border:1.5px solid var(--primary);
  background:var(--primary);
  color:#fff;
  border-radius:var(--radius-sm);
  font-size:.82rem;
  font-weight:600;
  cursor:pointer;
  animation:pulseApply 1.6s ease-in-out infinite;
}
.btn-apply-date:hover{ filter:brightness(1.08); }
@keyframes pulseApply{
  0%,100%{ box-shadow:0 0 0 0 rgba(26,86,219,.40); }
  50%{ box-shadow:0 0 0 5px rgba(26,86,219,.06); }
}
/* 跨度过大提示（双边模式且 >30 天） */
.date-span-hint{
  width:100%;
  font-size:.74rem;
  color:#d97706;
  margin-top:2px;
}

/* 开关行 */
.toggle-row{
  display:flex;
  gap:16px;
  align-items:center;
  flex-wrap:wrap;
}

/* 筛选面板 */
.filter-panel{
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* 筛选按钮（仅移动端显示） */
.filter-toggle-btn{
  display:none;
}

/* 数据按钮组 */
.data-buttons{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

/* 状态筛选 chips */
.status-chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.chip{
  padding:5px 11px;
  border-radius:20px;
  font-size:.78rem;
  font-weight:500;
  border:1.5px solid var(--border);
  background:var(--card-bg);
  color:var(--text-muted);
  transition:all .2s;
  white-space:nowrap;
}
.chip:hover{border-color:var(--border-strong);color:var(--text);}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.chip.active[data-status="success"]{background:var(--success);border-color:var(--success);}
.chip.active[data-status="failed"]{background:var(--failed);border-color:var(--failed);}
.chip.active[data-status="partial"]{background:var(--partial);border-color:var(--partial);}
.chip.active[data-status="skipped"]{background:var(--skipped);border-color:var(--skipped);}

/* ==================== 日志列表 ==================== */
.log-list{display:flex;flex-direction:column;gap:20px;}

/* 日期分组（accordion 下拉式，标题位于卡片顶部） */
.day-group{
  background:var(--card-bg);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  overflow:hidden;
}
.day-group-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  cursor:pointer;
  user-select:none;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  transition:background .2s;
}
.day-group-header:hover{background:#e2e8f0;}
.day-group-header.collapsed{background:var(--card-bg);border-bottom-color:transparent;}
.day-group-header .arrow{
  width:18px;height:18px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
  color:var(--text-muted);
  font-size:.7rem;
  flex-shrink:0;
}
.day-group-header.collapsed .arrow{transform:rotate(-90deg);}
.day-group-title{
  font-size:1rem;
  font-weight:600;
  color:var(--text);
}
.day-date-sub{
  font-size:.72rem;
  font-weight:400;
  color:var(--text-light);
  margin-left:4px;
}
.day-group-count{
  font-size:.78rem;
  color:var(--text-muted);
  background:var(--border);
  padding:1px 9px;
  border-radius:10px;
  font-weight:500;
}
.day-group-content{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:14px 16px;
  overflow:hidden;
  transition:max-height .3s ease,opacity .2s ease;
}
.day-group-content.hidden{display:none;}

/* 搜索结果分组（与日期分组同样的 accordion 卡片样式） */
.search-group-header{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:13px 16px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.search-group-title{
  font-size:1.05rem;
  font-weight:700;
  color:var(--primary);
}
.search-group-title .kw{color:var(--text);}
.search-subtitle{
  font-size:.8rem;
  color:var(--text-muted);
}

/* ==================== 日志卡片 ==================== */
.log-card{
  width:100%;
  background:var(--card-bg);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 16px;
  border:1px solid var(--border);
  border-left:4px solid var(--border-strong);
  transition:box-shadow .2s,transform .2s;
  user-select:none;
  -webkit-user-select:none;
}
.log-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);}
.log-card[data-status="success"]{border-left-color:var(--success);}
.log-card[data-status="failed"]{border-left-color:var(--failed);}
.log-card[data-status="partial"]{border-left-color:var(--partial);}
.log-card[data-status="skipped"]{border-left-color:var(--skipped);}

.card-top{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:8px;
}
.card-machine{font-size:.85rem;color:var(--text);font-weight:600;}
.card-sn{
  font-size:.78rem;color:var(--text-muted);
  background:var(--bg);padding:1px 7px;border-radius:4px;
  font-family:"Cascadia Code",Consolas,monospace;
}

.card-datetime{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:.78rem;
  padding:3px 10px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  white-space:nowrap;
}
.card-datetime-label{
  color:var(--text-light);
  font-weight:600;
}
.card-datetime-value{
  color:var(--text);
  font-variant-numeric:tabular-nums;
}

/* 功能摘要 */
.feature-summary{
  display:flex;
  flex-wrap:wrap;
  gap:4px 10px;
  margin:8px 0;
  font-size:.84rem;
}
.feat{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:1px 7px;
  border-radius:4px;
  background:var(--bg);
}
.feat .ico{font-weight:700;}
.feat[data-result="success"] .ico{color:var(--success);}
.feat[data-result="failed"] .ico{color:var(--failed);}
.feat[data-result="partial"] .ico{color:var(--partial);}
.feat[data-result="skipped"] .ico{color:var(--skipped);}
.feat[data-result="success"]{background:var(--success-bg);}
.feat[data-result="failed"]{background:var(--failed-bg);}
.feat[data-result="partial"]{background:var(--partial-bg);}
.feat[data-result="skipped"]{background:var(--skipped-bg);}

/* 元数据行 */
.card-meta{
  font-size:.78rem;
  color:var(--text-muted);
  display:flex;
  flex-wrap:wrap;
  gap:4px 12px;
  margin-bottom:8px;
}
.card-meta .meta-item{display:inline-flex;align-items:center;gap:4px;}
.card-meta .meta-label{color:var(--text-light);}

/* 卡片底部操作区 */
.card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
  flex-wrap:wrap;
  margin-top:6px;
}
.card-actions{display:flex;gap:8px;flex-shrink:0;}
.btn-mini{
  font-size:.78rem;
  padding:5px 11px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);
  background:var(--card-bg);
  color:var(--text-muted);
  transition:all .2s;
  white-space:nowrap;
  text-decoration:none; /* [2026-08-21] 去掉<a>默认下划线（官网驱动按钮） */
}
.btn-mini:hover{text-decoration:none;} /* 保险:hover 时也不显示下划线 */
.btn-mini:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
.btn-icon{width:14px;height:14px;vertical-align:-2px;margin-right:3px;}
/* 鼠标靠近或按下时图标循环旋转 */
.btn-mini:hover .btn-icon,
.btn-mini:active .btn-icon{
  animation:iconSpin .9s linear infinite;
}
@keyframes iconSpin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* 备注区域 */
.note-area{flex:0 1 auto;min-width:180px;}
/* [2026-08-22 FIX] 备注块与出库按钮之间留 8px 间距，
   避免两者紧贴（截图：+ 添加备注 和 📦 出库记录 边框几乎挨在一起） */
.note-area > .note-empty,
.note-area > .note-display,
.note-area > .note-edit{margin-right:8px;}
.note-display{
  font-size:.8rem;
  color:var(--text);
  background:var(--highlight);
  background:rgba(254,240,138,.35);
  border:1px dashed var(--border-strong);
  border-radius:var(--radius-sm);
  padding:6px 10px;
  cursor:pointer;
  transition:background .2s;
  display:flex;
  align-items:center;
  gap:6px;
}
.note-display:hover{background:rgba(254,240,138,.6);}
.note-display .note-text{flex:1;word-break:break-word;}
.note-display .note-del{
  font-size:.9rem;
  opacity:.5;
  transition:opacity .2s;
  flex-shrink:0;
}
.note-display .note-del:hover{opacity:1;color:var(--failed);}
.note-empty{
  font-size:.78rem;
  color:var(--text-light);
  border:1px dashed var(--border);
  border-radius:var(--radius-sm);
  padding:5px 10px;
  cursor:pointer;
  transition:all .2s;
  display:inline-block;
}
.note-empty:hover{border-color:var(--primary);color:var(--primary);}
.note-edit{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.note-edit textarea{
  width:100%;
  min-height:50px;
  padding:7px 10px;
  border:1.5px solid var(--primary);
  border-radius:var(--radius-sm);
  font-size:.82rem;
  resize:vertical;
  outline:none;
  font-family:inherit;
  box-shadow:0 0 0 3px var(--primary-light);
}
.note-edit .note-btns{display:flex;gap:6px;}
.note-edit .btn-save{
  font-size:.76rem;padding:4px 12px;border-radius:5px;
  background:var(--primary);color:#fff;font-weight:500;
}
.note-edit .btn-cancel{
  font-size:.76rem;padding:4px 12px;border-radius:5px;
  border:1px solid var(--border-strong);color:var(--text-muted);background:#fff;
}

/* ==================== [2026-08-22] 备注服务端持久化：暂存区 + 冲突气泡 + 上传确认卡 ==================== */
/* 卡片上的"待上传"入口（暂不修改的冲突备注存在本地时显示） */
.note-pending{
  font-size:.78rem;
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 10px;
  background:rgba(251,146,60,.15);
  border:1px dashed #fb923c;
  border-radius:var(--radius-sm);
  color:var(--text);
}
.note-pending-text{flex:1;word-break:break-word;min-width:0;color:#c2410c;}
.note-pending-btn{
  flex-shrink:0;
  font-size:.76rem;padding:3px 10px;border-radius:5px;
  background:#fb923c;color:#fff;font-weight:500;border:none;cursor:pointer;
  white-space:nowrap;
}
.note-pending-btn:hover{background:#ea580c;}
.note-pending-del{
  flex-shrink:0;font-size:.9rem;opacity:.5;cursor:pointer;
}
.note-pending-del:hover{opacity:1;color:var(--failed);}

/* 备注冲突气泡（红色警告，样式基于 .log-notify） */
.note-conflict{
  position:fixed;
  top:24px;right:24px;
  z-index:9999;
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px 18px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-radius:var(--radius);
  box-shadow:0 4px 24px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.06);
  border:2px solid #ef4444;
  max-width:440px;
  animation:notifySlideIn .35s cubic-bezier(.34,1.56,.64,1);
}
.note-conflict-icon{
  flex-shrink:0;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;color:#ef4444;line-height:1;
}
.note-conflict-body{flex:1;min-width:0;}
.note-conflict-title{
  font-size:.9rem;font-weight:600;color:#ef4444;margin-bottom:4px;
}
.note-conflict-sn{font-size:.78rem;color:var(--text-muted);margin-bottom:6px;word-break:break-all;}
.note-conflict-current{
  font-size:.8rem;color:var(--text);
  background:var(--failed-bg);
  border:1px solid rgba(239,68,68,.35);
  border-radius:var(--radius-sm);
  padding:6px 10px;margin-bottom:10px;
  word-break:break-word;line-height:1.45;
}
.note-conflict-current .label{font-weight:600;color:#ef4444;margin-right:6px;}
.note-conflict-current .subtime{display:block;margin-top:3px;font-size:.72rem;color:var(--text-muted);}
.note-conflict-current .hint{margin-top:6px;font-size:.82rem;color:var(--text);font-weight:500;}
.note-conflict-current b{color:var(--text);font-weight:600;}
.note-conflict-btns{display:flex;gap:8px;}
.note-conflict-btns .btn-overwrite{
  padding:6px 14px;border-radius:var(--radius-sm);
  background:#ef4444;color:#fff;font-size:.8rem;font-weight:500;border:none;cursor:pointer;
  white-space:nowrap;
}
.note-conflict-btns .btn-overwrite:hover{background:#dc2626;}
.note-conflict-btns .btn-keeplocal{
  padding:6px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);color:var(--text-muted);background:#fff;
  font-size:.8rem;cursor:pointer;white-space:nowrap;
}
.note-conflict-btns .btn-keeplocal:hover{color:var(--text);}
.note-conflict-close{
  flex-shrink:0;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:var(--text-muted);cursor:pointer;border:none;background:none;
  border-radius:4px;line-height:1;
}
.note-conflict-close:hover{color:var(--text);background:var(--bg);}

/* 上传备注二次确认卡（模态，样式基于 .auth-overlay） */
.upload-confirm-overlay{
  position:fixed;z-index:10001;inset:0;
  background:rgba(15,23,42,.85);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
.upload-confirm-overlay.hidden{display:none;}
.upload-confirm-card{
  background:var(--card-bg);border-radius:16px;
  padding:32px 30px;width:520px;max-width:92vw;
  box-shadow:var(--shadow-lg);
}
.upload-confirm-card h3{
  margin:0 0 6px;font-size:1.15rem;color:var(--text);font-weight:700;
}
.upload-confirm-card .sub{font-size:.82rem;color:var(--text-muted);margin-bottom:18px;}
.upload-confirm-compare{
  display:flex;gap:12px;margin-bottom:18px;
}
.upload-confirm-box{
  flex:1;min-width:0;
  border-radius:var(--radius);
  padding:10px 12px;
  font-size:.82rem;line-height:1.5;
  word-break:break-word;
}
.upload-confirm-box .box-label{
  font-size:.74rem;font-weight:600;margin-bottom:6px;display:block;
}
.upload-confirm-box.server{
  background:var(--failed-bg);border:1px solid rgba(239,68,68,.35);
}
.upload-confirm-box.server .box-label{color:#ef4444;}
.upload-confirm-box.local{
  background:rgba(254,240,138,.35);border:1px dashed var(--border-strong);
}
.upload-confirm-box.local .box-label{color:#c2410c;}
.upload-confirm-box.empty{color:var(--text-light);font-style:italic;}
.upload-confirm-btns{display:flex;gap:10px;justify-content:flex-end;}
.upload-confirm-btns .btn-confirm{
  padding:8px 18px;border-radius:var(--radius-sm);
  background:#ef4444;color:#fff;font-size:.86rem;font-weight:500;border:none;cursor:pointer;
}
.upload-confirm-btns .btn-confirm:hover{background:#dc2626;}
.upload-confirm-btns .btn-confirm:disabled{opacity:.6;cursor:not-allowed;}
.upload-confirm-btns .btn-cancel2{
  padding:8px 18px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);color:var(--text-muted);background:transparent;
  font-size:.86rem;cursor:pointer;
}
.upload-confirm-btns .btn-cancel2:hover{color:var(--text);}
@media(max-width:560px){
  .upload-confirm-compare{flex-direction:column;}
  .note-conflict{top:12px;right:12px;left:12px;max-width:none;}
}

/* ==================== [2026-08-24 OUTBOUND] 出库记录（由 CPU 拍照记录就地改造） ==================== */
/* 卡片入口按钮（与备注并列；有档案时绿色） */
.ob-btn{
  font-size:.78rem;
  /* [2026-08-22 FIX] 显式设置 line-height 匹配 .note-empty（span 继承 body 的 1.6，
     button 在 UA 样式表里 line-height:normal ≈1.2，会比 span 矮 ~7px） */
  line-height:1.6;
  color:var(--text-light);
  border:1px dashed var(--border);
  border-radius:var(--radius-sm);
  padding:5px 10px;
  cursor:pointer;
  transition:all .2s;
  display:inline-block;
  background:var(--card-bg);
  white-space:nowrap;
}
.ob-btn:hover{border-color:var(--primary);color:var(--primary);}
.ob-btn.has-record{
  border:1px solid rgba(34,197,94,.45);
  color:#15803d;
  background:rgba(34,197,94,.1);
}
.ob-btn.has-record:hover{background:rgba(34,197,94,.2);}

/* 弹层（上传/查看双模式） */
.ob-modal-overlay{
  position:fixed;z-index:10002;inset:0;
  background:rgba(15,23,42,.85);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
.ob-modal-overlay.hidden{display:none;}
.ob-modal-card{
  background:var(--card-bg);border-radius:16px;
  padding:26px 28px;width:560px;max-width:94vw;
  max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
}
.ob-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.ob-modal-head h3{margin:0;font-size:1.12rem;color:var(--text);font-weight:700;}
.ob-modal-close{
  font-size:1rem;color:var(--text-muted);cursor:pointer;border:none;background:none;
  border-radius:4px;line-height:1;padding:4px;
}
.ob-modal-close:hover{color:var(--text);background:var(--bg);}
.ob-modal-sn{font-size:.8rem;color:var(--text-muted);margin-bottom:16px;font-family:"Cascadia Code",Consolas,monospace;}

/* 上传模式：图片选择框（参考身份证上传布局） */
.ob-upload-box{margin-bottom:14px;}
.ob-upload-label{font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:6px;}
.ob-upload-label .opt{font-weight:400;color:var(--text-light);font-size:.74rem;}
.ob-upload-drop{
  border:2px dashed var(--border-strong);
  border-radius:var(--radius);
  padding:14px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:all .2s;
  background:var(--bg);
  min-height:96px;
}
.ob-upload-drop:hover{border-color:var(--primary);background:var(--primary-light);}
.ob-upload-drop.selected{border-style:solid;border-color:var(--success,#22c55e);}
.ob-upload-thumb{
  width:86px;height:86px;flex-shrink:0;
  border-radius:var(--radius-sm);
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--text-light);text-align:center;
  overflow:hidden;
}
.ob-upload-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.ob-upload-info{flex:1;min-width:0;font-size:.8rem;color:var(--text);}
.ob-upload-info .fname{word-break:break-all;}
.ob-upload-info .fhint{font-size:.74rem;color:var(--text-muted);margin-top:4px;}

/* 上传进度条（XHR） */
.ob-progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.ob-progress-bar{
  flex:1;height:8px;border-radius:4px;overflow:hidden;
  background:var(--bg);border:1px solid var(--border);
}
.ob-progress-bar > div{
  height:100%;width:0%;background:var(--primary);
  transition:width .15s linear;
}
.ob-progress-text{font-size:.78rem;color:var(--text-muted);white-space:nowrap;min-width:64px;text-align:right;}

/* 查看模式 */
.ob-view-info{font-size:.8rem;color:var(--text-muted);margin-bottom:12px;line-height:1.7;}
.ob-view-info b{color:var(--text);font-weight:600;}
.ob-view-imgs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.ob-view-item{
  flex:1;min-width:200px;max-width:100%;
  border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:zoom-in;transition:border-color .2s;
  background:var(--bg);
}
.ob-view-item:hover{border-color:var(--primary);}
.ob-view-item img{width:100%;max-height:200px;object-fit:contain;display:block;background:#0f172a08;}
.ob-view-broken{
  width:100%;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text-muted);font-size:.78rem;text-align:center;
  border:1px dashed var(--border);border-radius:6px;padding:16px 8px;gap:6px;
  background:#fef2f2;color:#b91c1c;border-color:#fecaca;
}
.ob-view-broken-meta{font-size:.68rem;color:#9ca3af;font-family:"Cascadia Code",Consolas,monospace;word-break:break-all;}
.ob-view-tag{
  font-size:.74rem;font-weight:600;color:var(--primary);
  padding:6px 10px 2px;
}
.ob-view-meta{
  font-size:.7rem;color:var(--text-muted);padding:2px 10px 8px;
  word-break:break-all;font-family:"Cascadia Code",Consolas,monospace;
}

/* 弹层底部按钮 */
.ob-modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;}
.ob-btn-save{
  padding:8px 20px;border-radius:var(--radius-sm);
  background:var(--primary);color:#fff;font-size:.86rem;font-weight:500;border:none;cursor:pointer;
}
.ob-btn-save:hover{background:var(--primary-dark);}
.ob-btn-save:disabled{opacity:.6;cursor:not-allowed;}
.ob-btn-plain{
  padding:8px 18px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);color:var(--text-muted);background:transparent;
  font-size:.86rem;cursor:pointer;
}
.ob-btn-plain:hover{color:var(--text);}
.ob-btn-danger{
  padding:8px 18px;border-radius:var(--radius-sm);
  background:#ef4444;color:#fff;font-size:.86rem;font-weight:500;border:none;cursor:pointer;
}
.ob-btn-danger:hover{background:#dc2626;}

/* 大图查看层（点击图片放大） */
.ob-img-viewer{
  position:fixed;z-index:10003;inset:0;
  background:rgba(0,0,0,.92);
  display:flex;align-items:center;justify-content:center;
  cursor:zoom-out;
}
.ob-img-viewer.hidden{display:none;}
.ob-img-viewer img{
  max-width:94vw;max-height:90vh;
  object-fit:contain;
  border-radius:4px;
}
.ob-img-viewer-close{
  position:absolute;top:18px;right:22px;
  font-size:1.5rem;color:#fff;cursor:pointer;border:none;background:none;
  opacity:.7;
}
.ob-img-viewer-close:hover{opacity:1;}

@media(max-width:560px){
  .ob-modal-card{padding:20px 16px;}
  .ob-view-imgs{flex-direction:column;}
}


/* 匹配片段预览（搜索时显示匹配到的 consoleLog/config 片段） */
.match-snippet{
  font-size:.76rem;
  color:var(--text-muted);
  background:var(--bg);
  border-radius:var(--radius-sm);
  padding:5px 9px;
  margin-top:6px;
  border-left:2px solid var(--primary);
  font-family:"Cascadia Code",Consolas,monospace;
  white-space:pre-wrap;
  word-break:break-word;
  max-height:60px;
  overflow:hidden;
  user-select:text;
  -webkit-user-select:text;
}

/* ==================== 卡片展开详情 ==================== */
.log-card{cursor:pointer;}
.log-card.expanded{box-shadow:var(--shadow-hover);}
.card-detail{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--border);
  animation:detailFadeIn .2s ease;
  user-select:text;
  -webkit-user-select:text;
}
@keyframes detailFadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.card-detail.hidden{display:none;}

/* 详情区块 */
.detail-section{margin-bottom:14px;}
.detail-section:last-child{margin-bottom:0;}
.detail-section-title{
  font-size:.78rem;
  font-weight:700;
  color:var(--primary);
  margin-bottom:6px;
  padding-bottom:3px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:4px;
}

/* 信息气泡（纵向堆叠） */
.bubble-list{display:flex;flex-direction:column;gap:4px;}
.bubble{
  display:flex;
  align-items:flex-start;
  gap:6px;
  padding:5px 10px;
  background:var(--bg);
  border-radius:var(--radius-sm);
  font-size:.78rem;
  line-height:1.5;
  border:1px solid var(--border);
  word-break:break-word;
}
.bubble-label{
  color:var(--text-light);
  font-weight:600;
  white-space:nowrap;
  flex-shrink:0;
  min-width:60px;
}
.bubble-value{
  color:var(--text);
  flex:1;
  word-break:break-word;
}
.bubble-value.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:.76rem;}

/* 功能执行日志区块 */
.detail-feature{
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
}
.detail-feature:last-child{margin-bottom:0;}
.detail-feature-header{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  background:var(--bg);
  font-size:.78rem;
  font-weight:600;
  cursor:pointer;
  user-select:none;
}
.detail-feature-header .feat-result-ico{font-weight:700;}
.detail-feature-logs{
  padding:6px 10px;
  font-size:.74rem;
  font-family:"Cascadia Code",Consolas,monospace;
  color:var(--text-muted);
  white-space:pre-wrap;
  word-break:break-word;
  max-height:200px;
  overflow:auto;
  background:#fafbfc;
  border-top:1px solid var(--border);
}
/* 历史执行折叠区（合并日志后同功能多次执行） */
.exec-history{
  border-top:1px solid var(--border);
}
.exec-history summary{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  font-size:.72rem;
  color:var(--text-light);
  cursor:pointer;
  user-select:none;
  list-style:none;
  background:var(--bg);
}
.exec-history summary::-webkit-details-marker{display:none;}
.exec-history summary .exec-toggle{color:var(--text-light);font-size:.68rem;transition:transform .15s;}
.exec-history[open] summary .exec-toggle{transform:rotate(90deg);}
.exec-history summary .exec-result-ico{font-weight:700;font-size:.72rem;}
.exec-history .exec-body{
  padding:0 0 4px 0;
}
/* 控制台原文折叠区（subTasks 存在时收纳 consoleLogs，避免与结构化明细重复展示） */
.detail-console-collapse{
  border-top:1px solid var(--border);
}
.detail-console-collapse summary{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  font-size:.72rem;
  color:var(--text-light);
  cursor:pointer;
  user-select:none;
  list-style:none;
  background:var(--bg);
}
.detail-console-collapse summary::-webkit-details-marker{display:none;}
.detail-console-collapse summary .exec-toggle{color:var(--text-light);font-size:.68rem;transition:transform .15s;}
.detail-console-collapse[open] summary .exec-toggle{transform:rotate(90deg);}
.detail-console-collapse .detail-feature-logs{border-top:none;}
.exec-badge{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
  padding:0 6px;
  font-size:.66rem;
  font-weight:600;
  color:var(--text-light);
}
.detail-feature-configs{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:6px 10px;
  font-size:.74rem;
  border-top:1px solid var(--border);
  background:#fafbfc;
}
.detail-config-row{
  display:flex;
  gap:6px;
  font-family:"Cascadia Code",Consolas,monospace;
}
.detail-config-key{color:var(--text-light);min-width:100px;}
.detail-config-val{color:var(--text);word-break:break-word;}

/* 子任务明细（V2.4+ 日志结构） */
.detail-subtasks{
  padding:6px 10px;
  font-size:.74rem;
  border-top:1px solid var(--border);
  background:#fafbfc;
}
.detail-subtask-head{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:600;
  color:var(--text-light);
  margin-bottom:4px;
}
.detail-subtask-head .st-count{font-weight:400;color:var(--text-muted);}
.detail-subtask-row{
  display:flex;
  align-items:center;
  gap:6px;
  padding:2px 0;
}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  flex-shrink:0;
}
.status-dot.success{background:var(--success);}
.status-dot.failed{background:var(--failed);}
.status-dot.skipped{background:var(--skipped);}
.status-dot.partial{background:var(--partial);}
.detail-subtask-key{color:var(--text);font-weight:600;min-width:110px;}
.detail-subtask-status{color:var(--text-light);font-size:.68rem;}
.detail-subtask-dur{margin-left:auto;color:var(--text-muted);font-family:"Cascadia Code",Consolas,monospace;font-size:.68rem;}
.detail-subtask-change{
  margin:1px 0 2px 14px;
  color:var(--text-muted);
  font-family:"Cascadia Code",Consolas,monospace;
  word-break:break-word;
}
.detail-subtask-change .ch-before{color:var(--text-light);}
.detail-subtask-change .ch-arrow{color:var(--text-light);margin:0 4px;}
.detail-subtask-change .ch-after{color:var(--text);}
.detail-subtask-detail{
  margin:0 0 3px 14px;
  color:var(--text-light);
  word-break:break-word;
}
/* [2026-09-10 v2.2] 子任务明细标签化（音频测试：播放方式 / 曲目 / 设备 拆成小标签，比一行长文本更醒目） */
.detail-subtask-chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px 14px;}
.detail-subtask-chips .st-chip{
  background:var(--primary-light);border:1px solid #bfdbfe;color:var(--primary-dark);
  border-radius:6px;padding:1px 6px;font-size:.68rem;
  font-family:"Cascadia Code",Consolas,monospace;word-break:break-word;
}

/* ==================== 搜索高亮 ==================== */
.highlight{
  background:var(--highlight);
  color:var(--highlight-text);
  border-radius:2px;
  padding:0 1px;
  font-weight:600;
}

/* ==================== 空状态 ==================== */
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--text-light);
}
.empty-state .empty-icon{font-size:2.5rem;margin-bottom:12px;opacity:.5;}
.empty-state .empty-text{font-size:.95rem;}

/* ==================== 响应式：手机端 ==================== */
@media (max-width:600px){
  .container{padding:0 10px;}
  .header{padding:16px 0 12px;}
  .header h1{font-size:1.2rem;}
  .header .stats{font-size:.78rem;gap:8px;}
  .toolbar{padding:10px 12px;top:0;border-radius:8px;}
  .search-row{flex-direction:row;align-items:center;gap:8px;}
  #searchInput{flex:1;min-width:0;}

  /* 筛选按钮 - 移动端显示 */
  .filter-toggle-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:8px 12px;
    border:1.5px solid var(--border-strong);
    border-radius:var(--radius-sm);
    font-size:.82rem;
    color:var(--text-muted);
    background:var(--bg);
    white-space:nowrap;
    flex-shrink:0;
    transition:all .2s;
  }
  .filter-toggle-btn:hover{border-color:var(--primary);color:var(--primary);}
  .filter-toggle-btn.active{
    background:var(--primary-light);
    border-color:var(--primary);
    color:var(--primary);
    font-weight:600;
  }
  .filter-toggle-btn .arrow-icon{font-size:.7rem;transition:transform .2s;}
  .filter-toggle-btn.active .arrow-icon{transform:rotate(180deg);}

  /* 筛选面板 - 默认收起 */
  .filter-panel{
    display:none;
  }
  .filter-panel.expanded{
    display:flex;
    flex-direction:column;
    gap:10px;
    animation:panelSlideDown .2s ease;
    padding-top:4px;
  }
  @keyframes panelSlideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

  /* 开关行 */
  .toggle-row{gap:14px;}

  /* 筛选行 - 纵向堆叠 */
  .filter-row{flex-direction:column;align-items:stretch;gap:10px;}

  /* 日期范围 + 数据按钮 - 拆两行 */
  .date-group{flex-wrap:wrap;gap:6px;}
  .date-seg-group .seg{font-size:.8rem;padding:4px 2px;}
  .date-seg-group .seg[data-unit="year"]{width:2.9em;}
  .date-sep{flex-shrink:0;}
  .data-buttons{width:100%;display:flex;gap:8px;}
  .data-buttons .btn-mini{flex:1;padding:7px 0;text-align:center;font-size:.76rem;}

  /* 状态 chips - 自动换行 */
  .status-chips{justify-content:flex-start;flex-wrap:wrap;overflow-x:visible;padding-bottom:0;}

  /* 卡片 meta - 2列网格 */
  .card-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px 8px;
  }
  .card-meta .meta-item{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .day-group-header{padding:11px 12px;}
  .day-group-content{padding:12px;}
  .log-card{padding:12px;}
  .card-top{gap:6px;}
  .card-datetime{font-size:.74rem;padding:2px 8px;}
  .card-machine{font-size:.82rem;}
  .feature-summary{font-size:.8rem;gap:3px 6px;}
  .card-bottom{flex-direction:column;align-items:stretch;}
  .card-actions{justify-content:flex-end;}
  .note-area{width:100%;}
  .btn-mini{font-size:.74rem;padding:5px 9px;}
  .bubble{font-size:.74rem;padding:4px 8px;}
  .bubble-label{min-width:50px;}
  .detail-feature-logs{font-size:.7rem;}
  .detail-config-row{flex-direction:column;gap:0;}
  .detail-config-key{min-width:0;}
  .detail-subtask-key{min-width:76px;}
  .detail-subtask-row{flex-wrap:wrap;}
}

/* ==================== 加载遮罩 ==================== */
.loading-overlay{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:200;gap:16px;
  transition:opacity .3s;
}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
.loading-spinner{
  width:40px;height:40px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.95rem;color:var(--text);font-weight:500;}
.loading-progress{font-size:.8rem;color:var(--text-muted);font-family:"Cascadia Code",Consolas,monospace;}
.loading-bar-wrap{width:220px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.loading-bar{height:100%;background:var(--primary);border-radius:2px;transition:width .3s;width:0;}

/* 数据来源标识 */
.data-source{
  font-size:.72rem;
  padding:2px 8px;
  border-radius:4px;
  font-weight:500;
  white-space:nowrap;
}
.data-source[data-src="real"]{background:var(--success-bg);color:var(--success);}
.data-source[data-src="sample"]{background:var(--skipped-bg);color:var(--skipped);}

/* [2026-08-21] 版本号徽章（头部标题，与数据来源徽章同规格·灰色低调） */
.version-badge{
  font-size:.72rem;
  padding:2px 8px;
  border-radius:4px;
  font-weight:500;
  white-space:nowrap;
  background:var(--border);
  color:var(--text-muted);
}

/* ==================== 动画 ==================== */
@keyframes cardEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.log-card{animation:cardEnter .25s ease both;}
/* ==================== 日志变更提醒气泡 ==================== */
.log-notify{
  position:fixed;
  top:24px;
  right:24px;
  z-index:9999;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-radius:var(--radius);
  box-shadow:0 4px 24px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.06);
  border:2px solid #eab308;
  max-width:420px;
  animation:notifySlideIn .35s cubic-bezier(.34,1.56,.64,1);
}
.log-notify-icon{
  flex-shrink:0;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;
  color:#eab308;
  line-height:1;
}
.log-notify-text{
  flex:1;
  font-size:.88rem;
  color:var(--text);
  line-height:1.45;
  min-width:0;
}
.log-notify-btn{
  flex-shrink:0;
  padding:6px 14px;
  border-radius:var(--radius-sm);
  background:var(--primary);
  color:#fff;
  font-size:.82rem;
  font-weight:500;
  border:none;
  cursor:pointer;
  transition:background .2s;
  white-space:nowrap;
}
.log-notify-btn:hover{background:var(--primary-dark);}
.log-notify-close{
  flex-shrink:0;
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
  color:var(--text-muted);
  cursor:pointer;
  border:none;
  background:none;
  border-radius:4px;
  transition:color .2s,background .2s;
  line-height:1;
}
.log-notify-close:hover{color:var(--text);background:var(--bg);}
.log-notify.hiding{
  animation:notifySlideOut .2s ease forwards;
}
@keyframes notifySlideIn{from{opacity:0;transform:translateY(-12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes notifySlideOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-8px) scale(.95)}}

/* 响应式：小屏时占满宽度 */
@media(max-width:480px){
  .log-notify{
    top:12px;right:12px;left:12px;
    max-width:none;
  }
}

/* ==================== 无限滚动：底部加载提示 ==================== */
.load-more-area{
  text-align:center;
  padding:18px 12px;
  color:var(--text-muted);
  font-size:.82rem;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.load-more-area.hidden{display:none;}
.load-more-dot{
  display:inline-block;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--primary);
  animation:dotPulse 1.2s ease-in-out infinite;
}
.load-more-dot:nth-child(2){animation-delay:.2s;}
.load-more-dot:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}

.load-more-done{
  color:var(--text-light);
  font-size:.8rem;
}

/* ==================== 已全部加载气泡弹窗 ==================== */
.toast-all-loaded{
  position:fixed;
  right:24px;
  bottom:80px;
  z-index:9998;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 18px;

  max-width:320px;
  font-size:.85rem;
  color:var(--text);
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:opacity .35s,transform .35s;
}
.toast-all-loaded.show{
  opacity:1;
  transform:translateY(0);
}
.toast-all-loaded-icon{font-size:1.1rem;flex-shrink:0;color:#22c55e;}
.toast-all-loaded-text{line-height:1.4;}
@media(max-width:480px){
  .toast-all-loaded{right:12px;left:12px;max-width:none;bottom:24px;}

/* ==================== 登录认证遮罩 ==================== */

  position:fixed;z-index:10000;inset:0;
  background:rgba(15,23,42,.85);

<script>
"use strict";
/* ====================================================================
 * LDTools 运行日志查看器  —  纯前端单页应用
 * 数据结构依据 RunLog_JSON_Structure.md (V2.5)
 * 功能：分组浏览 / 关键词搜索(精确+模糊) / 日期范围筛选 / 备注
 * ==================================================================== */

/* ==================== 一、配置常量 ==================== */

// 功能定义（featureId 对照表，来自真实数据）
const FEATURE_DEFS = [
  { id:1, name:'硬件信息',       short:'硬件' },
  { id:2, name:'更新时间及机型', short:'时间' },
  { id:3, name:'系统综合调试',    short:'调试' },
  { id:4, name:'驱动管理',       short:'驱动' },
  { id:5, name:'音频测试',       short:'音频' },
  { id:6, name:'清除使用痕迹',   short:'痕迹' },
];

// result 值 → 显示标签 & 图标
const RESULT_META = {
  success: { ico:'✓', label:'成功' },
  failed:  { ico:'✗', label:'失败' },
  partial: { ico:'⚠', label:'部分' },
  skipped: { ico:'⊘', label:'跳过' },
};

// localStorage 备注键名
const NOTES_KEY = 'log_viewer_notes';
// [2026-08-22] 冲突"暂不修改"的本地暂存区（独立于主备注，仅存待上传的冲突备注）
const PENDING_NOTES_KEY = 'log_viewer_pending_notes';
// 无限滚动：每批加载的日期分组数
const DATE_PAGE_SIZE = 10;

/* ==================== 访问认证 ==================== */
/* [2026-09-30 v1.06] token 改存 localStorage：原 sessionStorage 在 APP WebView 里每次关闭即清空，
   导致「每次打开都要填密码」。localStorage 持久化 + 记住的密码自动重登（token 过期/服务重启后无感续登） */
const AUTH_TOKEN_KEY = 'ldtools_auth_token';
const AUTH_REMEMBER_KEY = 'ldtools_saved_password';   // 记住的密码（明文本机存储，取消勾选即删）

function getAuthToken(){
  return localStorage.getItem(AUTH_TOKEN_KEY);
}

function setAuthToken(token){
  localStorage.setItem(AUTH_TOKEN_KEY, token);
}

function clearAuthToken(){
  localStorage.removeItem(AUTH_TOKEN_KEY);
}

function getRememberedPassword(){
  try{ return localStorage.getItem(AUTH_REMEMBER_KEY) || ''; }catch(e){ return ''; }
}

/** [v1.06] 用记住的密码静默重登（服务端 token 过期或服务重启后），成功返回 true */
async function tryAutoLogin(){
  const pw = getRememberedPassword();
  if(!pw) return false;
  try{
    const resp = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const data = await resp.json();
    if(data.ok && data.token){ setAuthToken(data.token); return true; }
  }catch(e){}
  return false;
}

/** 带认证的 fetch 封装，自动附加 Authorization header
 *  [v1.06] 401 时先用记住的密码自动重登一次（_retried 防死循环），成功则原请求无感重试，仍失败才弹登录框 */
async function apiFetch(url, options = {}, _retried = false){
  const token = getAuthToken();
  if(!token) throw new Error('未登录');
  const headers = Object.assign({}, options.headers || {}, {
    'Authorization': 'Bearer ' + token
  });
  // [2026-08-22 STALE-FIX] 强制绕开浏览器 HTTP 缓存
  // 根因：localhost origin 存有旧的 /api/manifest 等响应缓存，普通模式复用导致
  // "数据始终旧一天"（192.168.1.127 是新 origin 缓存为空故正常）。
  // fetch cache 模式 'no-store' 让请求永不读缓存，与服务端 no-store 头双保险。
  const opts = Object.assign({}, options, { headers, cache: 'no-store' });
  const resp = await fetch(url, opts);
  if(resp.status === 401){
    // token 过期或无效 → 自动重登一次，仍失败才显示登录界面
    clearAuthToken();
    if(!_retried && await tryAutoLogin()){
      return apiFetch(url, options, true);
    }
    showAuthOverlay();
    throw new Error('登录已过期，请重新输入密码');
  }
  return resp;
}

/** 显示登录遮罩 [v1.06] 记住的密码预填，只需点「验证」 */
function showAuthOverlay(){
  const overlay = document.getElementById('authOverlay');
  const pwInput = document.getElementById('authPassword');

  document.querySelector('.loading-overlay')?.classList.add('hidden');
}

/** 隐藏登录遮罩，开始加载数据 */
function hideAuthOverlay(){
  const overlay = document.getElementById('authOverlay');
  if(overlay) overlay.classList.add('hidden');
}

/** 登录验证 */
async function doLogin(password){
  const btn = document.getElementById('authSubmitBtn');
  const errEl = document.getElementById('authError');
  btn.disabled = true;
  btn.textContent = '验证中...';
  errEl.style.display = 'none';

  try{
    const resp = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await resp.json();
    if(data.ok && data.token){
      setAuthToken(data.token);
      // [v1.06] 记住密码：勾选 → 存本机（下次自动登录）；取消勾选 → 立即删除
      const cb = document.getElementById('authRemember');
      if(cb && cb.checked) localStorage.setItem(AUTH_REMEMBER_KEY, password);
      else localStorage.removeItem(AUTH_REMEMBER_KEY);
      hideAuthOverlay();
      init();  // 认证成功后启动应用
    } else {
      errEl.textContent = data.message || '密码错误';
      errEl.style.display = 'block';
    }
  } catch(e){
    errEl.textContent = '网络错误，请检查服务是否启动';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '验证';
  }
}

document.addEventListener('DOMContentLoaded', function(){
  const form = document.getElementById('authForm');
  const input = document.getElementById('authPassword');
  if(form){
    form.addEventListener('submit', function(e){

  // 检查是否已有 token → 验证有效性
  const token = getAuthToken();
  if(token){
    apiFetch('/api/version')
      .then(function(r){ return r.json(); })
      .then(function(){ hideAuthOverlay(); init(); })
      .catch(function(){
        // 401 已在 apiFetch 内自动重登重试；仍失败时登录遮罩已显示
        // 此处仅确保不执行 init
      });
  } else {
    // [v1.06] 无 token 但记住过密码 → 静默自动登录（不弹遮罩不输密码）
    tryAutoLogin().then(function(ok){
      if(ok){ hideAuthOverlay(); init(); }
      else showAuthOverlay();
    });
  }
});

// HTML 转义（防 XSS）
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 净化字符串：移除所有非字母数字字符（模糊匹配用）
function purify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g,''); }

// 日期格式化：Date → "YYYY-MM-DD"
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
// 时间格式化：Date → "YYYY-MM-DD HH:mm:ss"
function fmtTime(d){
  return fmtDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
// 时间格式化（带星期）：Date → 'YYYY-MM-DD "星期X" HH:mm:ss'（星期日~星期六，周日显示"星期日"）
function fmtTimeWeek(d){
  const weekChars = ['日','一','二','三','四','五','六']; // getDay(): 0=周日
  const t = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  return fmtDate(d)+' "星期'+weekChars[d.getDay()]+'" '+t;
}

// 过滤蓝牙 PAN 伪网卡：Windows 下 "Bluetooth Device (Personal Area Network)" 属蓝牙设备，不属于网卡，屏蔽显示
function filterNetAdapters(arr){
  if(!Array.isArray(arr)) return arr;
  return arr.filter(n => !/bluetooth.*personal area network/i.test((n && n.name) || ''));
}

// 日期字符串 → Date（当天 00:00）
function parseDate(s){ const d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }


/* ==================== 二-A、文件名解析 & 日志对象构建 ==================== */

// 从文件名解析时间戳和型号
// 文件名格式: YYMMDD-HHMMSS_<型号>_<序列号>.json
//   例: 260710-162648_YangTianM460-20IAB_GM0SV8FR.json
function parseFileName(fname){
  const base = fname.replace(/\.json$/i, '');
  const usIdx = base.indexOf('_');
  if(usIdx < 0) return { uploadTime: null, fileModel: '' };

  const tsPart = base.substring(0, usIdx);        // "260710-162648"
  const rest   = base.substring(usIdx + 1);       // "YangTianM460-20IAB_GM0SV8FR"

  // 解析时间: YYMMDD-HHMMSS → Date
  let uploadTime = null;
  const m = tsPart.match(/^(\d{2})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})$/);
  if(m){
    const d = new Date(
      2000 + parseInt(m[1], 10),  // year
      parseInt(m[2], 10) - 1,    // month (0-based)
      parseInt(m[3], 10),         // day
      parseInt(m[4], 10),         // hours
      parseInt(m[5], 10),         // minutes
      parseInt(m[6], 10)          // seconds
    );
    if(!isNaN(d)) uploadTime = d;
  }

  // 提取型号: 第一个 _ 到最后一个 _ 之间的部分，_ 替换为空格
  const lastUs = rest.lastIndexOf('_');
  let fileModel;
  if(lastUs > 0){
    fileModel = rest.substring(0, lastUs).replace(/_/g, ' ');
  } else {
    fileModel = rest.replace(/_/g, ' ');
  }

  return { uploadTime, fileModel };
}

// 从原始 JSON 数据 + 文件名构建日志对象
function buildLogFromRaw(rawData, fname){
  const parsed = parseFileName(fname);
  const hw = rawData.hardware || {};

  // 时间: 优先用 meta.generatedAt，回退到文件名解析
  let uploadTime = parsed.uploadTime;
  if(rawData.meta && rawData.meta.generatedAt){
    const d = new Date(rawData.meta.generatedAt);
    if(!isNaN(d)) uploadTime = d;
  }

  // SN: 从 bios.serialNumber 取值，回退到 lenovoInfo.machineNo
  const sn = (hw.bios && hw.bios.serialNumber && hw.bios.serialNumber.trim()) ||
             (hw.lenovoInfo && hw.lenovoInfo.machineNo && hw.lenovoInfo.machineNo.trim()) ||
             '';

  // 功能摘要: 每个 feature 取最后一次执行结果
  const featureSummary = (rawData.features || []).map(f => {
    const execs = f.executions || [];
    const last = execs[execs.length - 1] || { result: 'skipped' };
    const def = FEATURE_DEFS.find(d => d.id === f.featureId);
    const name = def ? def.name : (f.featureName || '功能' + f.featureId);
    const rMeta = RESULT_META[last.result] || RESULT_META.skipped;
    return { featureId: f.featureId, name, result: last.result, ico: rMeta.ico };
  });

  // 总体结果: failed > partial > success > skipped
  const results = featureSummary.map(f => f.result);
  let overallResult = 'skipped';
  if(results.includes('failed')){
    overallResult = 'failed';
  } else if(results.includes('partial')){
    overallResult = 'partial';
  } else if(results.includes('success')){
    overallResult = 'success';
  }

  // 构建 fullContent：将所有可搜索文本拼接为一个字符串，供 matchLog 匹配
  const contentParts = [fname, parsed.fileModel || '', sn];
  if(hw.hostModel) contentParts.push(hw.hostModel);
  if(hw.windowsPassword) contentParts.push('Windows密码: ' + hw.windowsPassword);
  (rawData.features || []).forEach(f => {
    contentParts.push(f.featureName || '');
    (f.executions || []).forEach(e => {
      (e.consoleLogs || []).forEach(l => contentParts.push(l));
      (e.configsBefore || []).forEach(c => contentParts.push(c.key + '=' + c.value));
      (e.configsAfter || []).forEach(c => contentParts.push(c.key + '=' + c.value));
      (e.subTasks || []).forEach(t => {
        contentParts.push(t.key || '');
        if(t.before) contentParts.push('变更前: ' + t.before);
        if(t.after)  contentParts.push('变更后: ' + t.after);
        if(t.detail) contentParts.push(t.detail);
      });
    });
  });

  // 硬件信息加入搜索索引
  if(hw.cpuName)          contentParts.push('CPU: ' + hw.cpuName);
  if(hw.cpuCores)         contentParts.push('CPU核心: ' + hw.cpuCores);
  if(hw.cpuMaxSpeed)      contentParts.push('CPU频率: ' + hw.cpuMaxSpeed);
  if(Array.isArray(hw.memory)){
    hw.memory.forEach((m,i) => {
      contentParts.push('内存条'+(i+1)+': ' + (m.capacityGB||'') + 'GB ' + (m.manufacturer||'') + ' ' + (m.partNumber||'') + ' ' + (m.speed||'') + 'MHz');
    });
  }
  if(hw.motherboard){
    contentParts.push('主板: ' + (hw.motherboard.manufacturer||'') + ' ' + (hw.motherboard.product||'') + ' SN:' + (hw.motherboard.serialNumber||''));
  }
  if(hw.bios){
    contentParts.push('BIOS: ' + (hw.bios.name||'') + ' ' + (hw.bios.version||'') + ' ' + (hw.bios.manufacturer||'') + ' SN:' + (hw.bios.serialNumber||''));
  }
  if(Array.isArray(hw.disks)){
    hw.disks.forEach((d,i) => {
      contentParts.push('磁盘'+(i+1)+': ' + (d.sizeGB||'') + 'GB ' + (d.model||'') + ' ' + (d.partitions||'') + ' SN:' + (d.serialNumber||''));
    });
  }
  if(Array.isArray(hw.removableDisks)){
    hw.removableDisks.forEach((d,i) => {
      contentParts.push('移动磁盘'+(i+1)+': ' + (d.sizeGB||'') + 'GB ' + (d.model||'') + ' ' + (d.partitions||'') + ' SN:' + (d.serialNumber||''));
    });
  }
  if(Array.isArray(hw.gpus)){
    hw.gpus.forEach((g,i) => {
      contentParts.push('显卡'+(i+1)+': ' + (g.name||'') + ' 显存:' + (g.adapterRAM_GB||0) + 'GB 驱动:' + (g.driverVersion||''));
    });
  }
  if(Array.isArray(hw.networkAdapters)){
    filterNetAdapters(hw.networkAdapters).forEach((n,i) => {
      contentParts.push('网卡'+(i+1)+': ' + (n.name||'') + ' MAC:' + (n.macAddress||'') + (n.linkSpeed ? ' 速率:' + n.linkSpeed : ''));
    });
  }
  if(Array.isArray(hw.bluetooths) && hw.bluetooths.length){
    hw.bluetooths.forEach((b,i) => {
      contentParts.push('蓝牙'+(i+1)+': ' + (b.name||'') + ' 驱动:' + (b.driverVersion||'') + (b.status ? ' ' + b.status : ''));
    });
  }
  // 电池（[2026-09-10 v2.2] 新增；无电池机型整块不产出，向后兼容旧日志）
  if(Array.isArray(hw.batteries) && hw.batteries.length){
    hw.batteries.forEach((b,i) => {
      const segs = batterySegments(b);
      if(segs.length) contentParts.push('电池'+(i+1)+': ' + segs.join(' '));
    });
  }
  if(hw.windowsVersion)   contentParts.push('Windows版本: ' + hw.windowsVersion);
  if(hw.windowsLicenseStatus) contentParts.push('许可证状态: ' + hw.windowsLicenseStatus);
  if(hw.oobeStatus)       contentParts.push('OOBE状态: ' + hw.oobeStatus);
  // 镜像历史机型：[2026-09-17] 按用户决定不进搜索索引（仅详情气泡展示），勿在此添加
  if(hw.lenovoInfo){
    const li = hw.lenovoInfo;
    if(li.productModel) contentParts.push('官方型号: ' + li.productModel);
    if(li.productLine)  contentParts.push('产品线: ' + li.productLine);
    if(li.machineName)  contentParts.push('出厂配置: ' + li.machineName);
    if(li.machineNo)    contentParts.push('主机序列号: ' + li.machineNo);
  }

  return {
    id:              fname,              // 唯一标识（文件名唯一）
    fileName:        fname,
    fileModel:       parsed.fileModel,   // 从文件名提取的型号
    sn,
    uploadTime,
    uploadDateStr:   uploadTime ? fmtDate(uploadTime) : '',
    rawData,
    overallResult,
    featureSummary,
    fullContent:     contentParts.join('\n'),
  };
}

// 加载遮罩操作
const loadingOverlay = document.getElementById('loadingOverlay');

const loadingBar     = document.getElementById('loadingBar');

function showLoading(text){
  loadingText.textContent = text;
  loadingBar.style.width = '0%';

}
function updateLoadingProgress(done, total, currentFile){
  const pct = total > 0 ? Math.round(done / total * 100) : 100;
  loadingBar.style.width = pct + '%';

// 加载文件清单，解析文件名日期
async function loadManifest(){
  const resp = await apiFetch('/api/manifest');
  if(!resp.ok){
    const err = await resp.json().catch(()=>({code:'ERR_UNKNOWN',message:'未知错误'}));
    throw { code: err.code || 'ERR_'+resp.status, message: err.message || resp.statusText };
  }
  const manifest = await resp.json();
  if(!manifest.files || manifest.files.length === 0) return false;

  state.manifestFiles = manifest.files;
  state.fileDateMap = {};
  const dates = [];
  for(const fname of manifest.files){
    const parsed = parseFileName(fname);
    if(parsed && parsed.uploadTime && !isNaN(parsed.uploadTime)){
      const ds = fmtDate(parsed.uploadTime);
      state.fileDateMap[fname] = ds;
      dates.push(ds);
    } else {
      state.fileDateMap[fname] = '';
    }
  }
  dates.sort();
  state.dataMinDate = dates[0] || '';
  state.dataMaxDate = dates[dates.length-1] || '';

  // [2026-08-22 STALE-FIX] 服务端元数据兜底（双保险）
  // 服务端从文件名提取的日期范围更可靠；前端 parseFileName 若有遗漏
  // （例如某文件名解析失败没进 dates），用服务端值修正，防止
  // dataMaxDate 落后 → getDefaultDateRange clamp 掉最新数据
  if(manifest.earliestDate && (!state.dataMinDate || manifest.earliestDate < state.dataMinDate)){
    state.dataMinDate = manifest.earliestDate;
  }
  if(manifest.latestDate && (!state.dataMaxDate || manifest.latestDate > state.dataMaxDate)){
    state.dataMaxDate = manifest.latestDate;
  }
  return true;
}

// 计算默认日期范围：今天往前推 9 天（共 10 天），clamp 到数据范围
function getDefaultDateRange(){
  const today = new Date();
  const nineDaysAgo = new Date(today.getTime() - 9 * 86400000);
  let start = fmtDate(nineDaysAgo);
  let end = fmtDate(today);
  // clamp 到数据范围
  if(state.dataMinDate && start < state.dataMinDate) start = state.dataMinDate;
  if(state.dataMaxDate && end > state.dataMaxDate) end = state.dataMaxDate;
  // 如果 start > end（数据全在 10 天前），显示数据最后 10 天
  if(start > end){
    end = state.dataMaxDate;
    const d = new Date(parseDate(end).getTime() - 9 * 86400000);
    start = fmtDate(d);
    if(start < state.dataMinDate) start = state.dataMinDate;
  }
  return { start, end };
}

// 加载指定日期范围内的文件（增量，跳过已加载的）
async function decryptFilesInDateRange(dateStart, dateEnd){
  // 筛选出需要加载的文件
  const needDecrypt = state.manifestFiles.filter(fname=>{
    if(state.decryptedSet.has(fname)) return false;
    const ds = state.fileDateMap[fname];
    if(!ds) return false;
    return ds >= dateStart && ds <= dateEnd;
  });

  if(needDecrypt.length === 0) return 0;

  state.isLoading = true;
  if(needDecrypt.length > 3) showLoading('正在加载 ' + needDecrypt.length + ' 个日志文件...');

  // ==================== 并发加载（方案A） ====================
  // [ROLLBACK 2026-08-20] 如需回退串行版本，删除下方并发块，恢复：
  //   let success = 0;
  //   for(let i = 0; i < needDecrypt.length; i++){
  //     const fname = needDecrypt[i];
  //     if(needDecrypt.length > 3) updateLoadingProgress(i, needDecrypt.length, fname);
  //     try{
  //       const fileResp = await apiFetch('/api/file?name=' + encodeURIComponent(fname));
  //       if(!fileResp.ok) continue;
  //       const rawData = await fileResp.json();
  //       const log = buildLogFromRaw(rawData, fname);
  //       state.logs.push(log);
  //       state.decryptedSet.add(fname);
  //       success++;
  //     }catch(err){
  //       console.warn('加载失败:', fname, err.message);
  //       state.decryptedSet.add(fname); // 失败也标记，避免反复重试
  //     }
  //   }
  const CONCURRENCY = 6;              // 并发请求数（LAN 内 FTP 服务端可承受）
  const total = needDecrypt.length;
  let success = 0, done = 0;
  const queue = needDecrypt.slice();  // 待加载队列，worker 各取所需

  async function loadWorker(){
    while(queue.length > 0){
      const fname = queue.shift();
      try{
        const fileResp = await apiFetch('/api/file?name=' + encodeURIComponent(fname));
        if(fileResp.ok){
          const rawData = await fileResp.json();
          const log = buildLogFromRaw(rawData, fname);
          state.logs.push(log);
          state.decryptedSet.add(fname);
          success++;
        }
        // !ok 不标记 decryptedSet，下次可重试（与原串行版语义一致）
      }catch(err){
        console.warn('加载失败:', fname, err.message);
        state.decryptedSet.add(fname); // 失败也标记，避免反复重试
      }
      done++;
      if(total > 3) updateLoadingProgress(done, total, fname);
    }
  }
  await Promise.all(Array.from({length: Math.min(CONCURRENCY, total)}, loadWorker));
  // ==================== 并发加载结束 ====================

  // 重新排序（新加入的日志需要合并到正确位置）
  state.logs.sort((a, b) => b.uploadTime - a.uploadTime);

  if(needDecrypt.length > 3){
    updateLoadingProgress(needDecrypt.length, needDecrypt.length, '');
    hideLoading();
  }
  state.isLoading = false;
  return success;
}

// 确保日期范围内文件已加载，然后渲染
async function ensureDecryptedAndRender(){
  if(state.isLoading) return; // 防止并发调用
  // 用 do-while 循环：加载完成后重新检查，防止用户在加载期间又改了日期范围
  let newCount;
  do {
    newCount = state.manifestFiles.filter(fname=>{
      if(state.decryptedSet.has(fname)) return false;
      const ds = state.fileDateMap[fname];
      return ds && ds >= state.dateStart && ds <= state.dateEnd;
    }).length;
    if(newCount > 0){
      await decryptFilesInDateRange(state.dateStart, state.dateEnd);
    }
  } while(newCount > 0);
  render();
  updateSpanHint();  // [2026-08-22] 加载完成后待处理数变为 0，刷新提示（口径B）
}

// 从 File 对象加载（支持加密文件和明文 JSON）
async function loadFromFiles(files){
  showLoading('正在解析文件...');
  const logs = [];
  let plainCount = 0, failCount = 0;

  for(let i = 0; i < files.length; i++){
    const file = files[i];
    updateLoadingProgress(i, files.length, file.name);
    try{
      const text = await file.text();
      const rawData = JSON.parse(text);
      logs.push(buildLogFromRaw(rawData, file.name));
      plainCount++;
    }catch(err){
      console.warn('文件解析失败:', file.name, err.message);
      failCount++;
    }
  }

  if(logs.length === 0){
    hideLoading();
    alert('解析失败：没有有效的日志文件');
    return;
  }

  logs.sort((a, b) => b.uploadTime - a.uploadTime);
  // 合并到缓存
  for(const log of logs){
    state.logs.push(log);
    state.decryptedSet.add(log.fileName);
  }
  state.logs.sort((a, b) => b.uploadTime - a.uploadTime);
  state.dataSource = 'real';
  console.log(`✓ 加载完成: ${plainCount} 明文, ${failCount} 失败`);

  // 更新数据范围
  const dates = state.logs.map(l=>l.uploadDateStr).sort();
  if(dates.length > 0){
    if(!state.dataMinDate || dates[0] < state.dataMinDate) state.dataMinDate = dates[0];
    if(!state.dataMaxDate || dates[dates.length-1] > state.dataMaxDate) state.dataMaxDate = dates[dates.length-1];
  }
  updateDateInputs();
  resetDateState();
  state.collapsedGroups.clear();
  state.expandedCards.clear();
  hideLoading();
  updateDataSourceBadge();
  render();
}

/* ==================== 五、搜索匹配与高亮 ==================== */

// 判断日志是否匹配关键词
// ===== 统一匹配：空格分词AND + 整体净化子串 + 同义词触点展开（单一模式，无开关） =====
// [2026-08-21] 由三档模式（精确/模糊/智能）合并而来，修复 splitTokens 无差别字母数字切分
// 导致「16g」被拆成「1 6 g」、AND 语义下大量误命中的问题
// 机型形态同义词表：旧命名 → 规范形式，按需扩充即可
// 例：Dell "OptiPlex 7020 MT"(旧) = "Tower Plus 7020"(新)，搜「7020mt」需归一为「tower」才能命中
const TOKEN_SYNONYMS = {
  'mt': 'tower', 'minitower': 'tower',   // Mini Tower → Tower
  'usdt': 'tiny',                        // 联想 Ultra Small Desktop → Tiny
  'usff': 'micro', 'mff': 'micro',       // Dell Ultra/Micro Form Factor → Micro
  'dt': 'desktop'                        // Desktop
};
// 反向映射（tower → [mt, minitower]），高亮时双向形态都要标出
const TOKEN_SYNONYMS_REV = {};
Object.keys(TOKEN_SYNONYMS).forEach(k=>{
  const v = TOKEN_SYNONYMS[k];
  (TOKEN_SYNONYMS_REV[v] = TOKEN_SYNONYMS_REV[v] || []).push(k);
});

// 统一匹配净化：保留字母数字 + 中文（purify 会丢中文，统一匹配不能用）
function smartPurify(s){ return String(s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g,''); }
// 全部同义词 token（旧命名 + 规范形式），按长度降序——长词优先，避免「minitower」被「tower」误切
const SYNONYM_TOKENS = Object.keys(TOKEN_SYNONYMS).concat(Object.keys(TOKEN_SYNONYMS_REV)).sort((a,b)=>b.length-a.length);
// token 的全部等价形态：归一到规范形式后取整组
// variantForms('mt') === variantForms('tower') → ['tower','mt','minitower']
function variantForms(t){
  const norm = TOKEN_SYNONYMS[t] || t;
  const forms = new Set([norm]);
  (TOKEN_SYNONYMS_REV[norm] || []).forEach(k=>forms.add(k));
  return Array.from(forms);
}
// 同义词触点检测：仅当 token 位于关键词词首或词尾时才展开
// 「7020mt」→ mt 在词尾 ✓；「width」中 dt 在词中间 ✗（不展开，避免误拆）
function findBoundarySynonym(cleanKw){
  for(const syn of SYNONYM_TOKENS){
    let pos = -1;
    if(cleanKw.startsWith(syn)) pos = 0;
    else if(cleanKw.endsWith(syn)) pos = cleanKw.length - syn.length;
    if(pos !== -1) return {syn, pos};
  }
  return null;
}
// 单关键词命中（不拆分字母数字）：
// ① 整体净化子串——「16g」匹配「16GB」✓，但不会匹配「Gen」「16核」✗（修复旧拆分bug的关键）
// ② 整体未命中且词首/词尾含同义词 → 拆分：其余部分整体命中 + 同义词任一等价形态命中
//    例：「7020mt」整体未命中 → 7020 ✓ + tower/mt/minitower 任一 ✓ → 命中「Tower Plus 7020」
function matchKeywordIn(kw, cleanContent){
  const cleanKw = smartPurify(kw);
  if(!cleanKw) return true;
  if(cleanContent.includes(cleanKw)) return true;
  const hit = findBoundarySynonym(cleanKw);
  if(hit){
    const before = cleanKw.slice(0, hit.pos);
    const after = cleanKw.slice(hit.pos + hit.syn.length);
    if((!before || cleanContent.includes(before)) && (!after || cleanContent.includes(after))){
      if(variantForms(hit.syn).some(f => cleanContent.includes(f))) return true;
    }
  }
  return false;
}
// 统一匹配：空格分隔多关键词，全部命中才匹配（AND 语义，顺序无关，含中文）
// 例：「p360 16g」→ [p360] 与 [16g] 各自整体净化命中；「联想 16g」→ 中文词同样支持
function matchUnified(fullContent, keyword){
  if(!keyword || !String(keyword).trim()) return true;
  const cleanContent = smartPurify(fullContent);
  return String(keyword).trim().split(/\s+/).every(kw => matchKeywordIn(kw, cleanContent));
}
// 统一模式高亮：各关键词整体形态 + 同义词拆分部分 + 等价形态，全部高亮（合并重叠区间）
// 例：搜「7020mt」→ 高亮 7020mt / 7020 / tower / mt / minitower；
//     搜「16g」→ 仅高亮 16g（不会把 Gen 的 G 或 16核 的 16 单独标出）
function highlightUnified(text, keyword){
  const surfaces = new Set();
  String(keyword || '').trim().split(/\s+/).forEach(kw=>{
    const cleanKw = smartPurify(kw);
    if(!cleanKw) return;
    surfaces.add(cleanKw);
    const hit = findBoundarySynonym(cleanKw);
    if(hit){
      const before = cleanKw.slice(0, hit.pos);
      const after = cleanKw.slice(hit.pos + hit.syn.length);
      if(before) surfaces.add(before);
      if(after) surfaces.add(after);
      variantForms(hit.syn).forEach(f=>surfaces.add(f));
    }
  });
  if(surfaces.size === 0) return esc(text);
  const charRe = /[a-z0-9\u4e00-\u9fff]/;
  const lower = text.toLowerCase();
  const map = [];
  for(let i=0;i<text.length;i++){
    if(charRe.test(lower[i])) map.push(i);
  }
  const cleanText = lower.replace(/[^a-z0-9\u4e00-\u9fff]/g,'');
  // 收集所有命中区间（原始索引），排序后合并重叠
  const ranges = [];
  surfaces.forEach(s=>{
    let pos = 0, idx;
    while((idx = cleanText.indexOf(s, pos)) !== -1){
      const sIdx = map[idx];
      const eIdx = map[idx + s.length - 1];
      if(sIdx !== undefined && eIdx !== undefined) ranges.push([sIdx, eIdx + 1]);
      pos = idx + s.length;
    }
  });
  if(ranges.length === 0) return esc(text);
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [ranges[0]];
  for(let i=1;i<ranges.length;i++){
    const last = merged[merged.length-1];
    if(ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
    else merged.push(ranges[i]);
  }
  let result = '', lastEnd = 0;
  merged.forEach(r=>{
    result += esc(text.slice(lastEnd, r[0]));
    result += '<span class="highlight">'+esc(text.slice(r[0], r[1]))+'</span>';
    lastEnd = r[1];
  });
  result += esc(text.slice(lastEnd));
  return result;
}

// 统一匹配入口（旧调用方传的第三参数 fuzzy 已忽略，保持签名兼容）
function matchLog(fullContent, keyword){
  if(!keyword) return true;
  return matchUnified(fullContent, keyword);
}

// [2026-08-21] highlightPrecise / highlightFuzzy 已随三档模式移除（统一走 highlightUnified）
// 回滚标记：如需恢复，从 git 历史或 2026-08-20 版本找回这两个函数及 highlight 的三分支

// 统一高亮入口（旧调用方传的第三参数 fuzzy 已忽略，保持签名兼容）
function highlight(text, keyword){
  if(!keyword) return esc(text);
  return highlightUnified(text, keyword);
}

// 查找匹配片段（用于卡片上显示 consoleLog/config 中匹配到的上下文）
function findMatchSnippet(log, keyword, fuzzy){
  if(!keyword) return null;
  const lines = [];
  const hw = log.rawData.hardware || {};
  // 硬件关键字段
  if(hw.windowsPassword) lines.push('Windows密码: '+hw.windowsPassword);
  if(hw.hostModel) lines.push('设备型号: '+hw.hostModel);
  if(hw.cpuName)          lines.push('CPU: ' + hw.cpuName);
  if(hw.cpuCores)         lines.push('CPU核心: ' + hw.cpuCores);
  if(hw.cpuMaxSpeed)      lines.push('CPU频率: ' + hw.cpuMaxSpeed);
  if(Array.isArray(hw.memory)){
    hw.memory.forEach((m,i) => {
      lines.push('内存条'+(i+1)+': ' + (m.capacityGB||'') + 'GB ' + (m.manufacturer||'') + ' ' + (m.partNumber||'') + ' ' + (m.speed||'') + 'MHz');
    });
  }
  if(hw.motherboard){
    lines.push('主板: ' + (hw.motherboard.manufacturer||'') + ' ' + (hw.motherboard.product||'') + ' SN:' + (hw.motherboard.serialNumber||''));
  }
  if(hw.bios){
    lines.push('BIOS: ' + (hw.bios.name||'') + ' ' + (hw.bios.version||'') + ' ' + (hw.bios.manufacturer||'') + ' SN:' + (hw.bios.serialNumber||''));
  }
  if(Array.isArray(hw.disks)){
    hw.disks.forEach((d,i) => {
      lines.push('磁盘'+(i+1)+': ' + (d.sizeGB||'') + 'GB ' + (d.model||'') + ' ' + (d.partitions||'') + ' SN:' + (d.serialNumber||''));
    });
  }
  if(Array.isArray(hw.removableDisks)){
    hw.removableDisks.forEach((d,i) => {
      lines.push('移动磁盘'+(i+1)+': ' + (d.sizeGB||'') + 'GB ' + (d.model||'') + ' ' + (d.partitions||'') + ' SN:' + (d.serialNumber||''));
    });
  }
  if(Array.isArray(hw.gpus)){
    hw.gpus.forEach((g,i) => {
      lines.push('显卡'+(i+1)+': ' + (g.name||'') + ' 显存:' + (g.adapterRAM_GB||0) + 'GB 驱动:' + (g.driverVersion||''));
    });
  }
  if(Array.isArray(hw.networkAdapters)){
    filterNetAdapters(hw.networkAdapters).forEach((n,i) => {
      lines.push('网卡'+(i+1)+': ' + (n.name||'') + ' MAC:' + (n.macAddress||'') + (n.linkSpeed ? ' 速率:' + n.linkSpeed : ''));
    });
  }
  if(Array.isArray(hw.bluetooths) && hw.bluetooths.length){
    hw.bluetooths.forEach((b,i) => {
      lines.push('蓝牙'+(i+1)+': ' + (b.name||'') + ' 驱动:' + (b.driverVersion||'') + (b.status ? ' ' + b.status : ''));
    });
  }
  // 电池（[2026-09-10 v2.2] 新增；与 contentParts 口径一致）
  if(Array.isArray(hw.batteries) && hw.batteries.length){
    hw.batteries.forEach((b,i) => {
      const segs = batterySegments(b);
      if(segs.length) lines.push('电池'+(i+1)+': ' + segs.join(' '));
    });
  }
  if(hw.windowsVersion)   lines.push('Windows版本: ' + hw.windowsVersion);
  if(hw.windowsLicenseStatus) lines.push('许可证状态: ' + hw.windowsLicenseStatus);
  if(hw.oobeStatus)       lines.push('OOBE状态: ' + hw.oobeStatus);
  // 镜像历史机型：[2026-09-17] 按用户决定不进搜索命中片段（仅详情气泡展示），勿在此添加
  if(hw.lenovoInfo){
    const li = hw.lenovoInfo;
    if(li.productModel) lines.push('官方型号: ' + li.productModel);
    if(li.productLine)  lines.push('产品线: ' + li.productLine);
    if(li.machineName)  lines.push('出厂配置: ' + li.machineName);
    if(li.machineNo)    lines.push('主机序列号: ' + li.machineNo);
  }
  (log.rawData.features||[]).forEach(f=>{
    (f.executions||[]).forEach(e=>{
      (e.consoleLogs||[]).forEach(l=>lines.push(l));
      (e.configsBefore||[]).forEach(c=>lines.push(c.key+'='+c.value));
      (e.configsAfter||[]).forEach(c=>lines.push(c.key+'='+c.value));
      (e.subTasks||[]).forEach(t=>{
        lines.push((t.key||'')+': '+(t.status||''));
        if(t.before) lines.push('变更前: '+t.before);
        if(t.after)  lines.push('变更后: '+t.after);
        if(t.detail) lines.push(t.detail);
      });
    });
  });
  // 统一匹配：优先返回「全部关键词命中」的行；若关键词分散在多行，兜底返回命中数最多的行
  const kws = String(keyword || '').trim().split(/\s+/).filter(k=>smartPurify(k));
  if(kws.length > 0){
    let bestLine = null, bestHits = 0;
    for(const line of lines){
      const lp = smartPurify(line);
      let hits = 0;
      kws.forEach(kw=>{ if(matchKeywordIn(kw, lp)) hits++; });
      if(hits === kws.length) return line;
      if(hits > bestHits){ bestHits = hits; bestLine = line; }
    }
    return bestLine;
  }
  return null;
}
