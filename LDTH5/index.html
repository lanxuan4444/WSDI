  // 元数据（折叠时显示的摘要行）
  const totalMemGB = (hw.memory || []).reduce((sum, m) => sum + (parseFloat(m && m.capacityGB) || 0), 0);
  const memGB = totalMemGB > 0 ? totalMemGB + 'GB' : 'N/A';
  const metaItems = [
    `<span class="meta-item"><span class="meta-label">版本</span> ${highlight(log.rawData.meta.toolVersion||'', kw, fuzzy)}</span>`,
    `<span class="meta-item"><span class="meta-label">CPU</span> ${highlight(hw.cpuName||'', kw, fuzzy)}</span>`,
    `<span class="meta-item"><span class="meta-label">内存</span> ${memGB}</span>`,
    `<span class="meta-item"><span class="meta-label">系统</span> ${highlight(hw.windowsVersion||'', kw, fuzzy)}</span>`,
  ];

  // 备注（所有交互元素都 stopPropagation，避免触发展开）
  const noteText = state.notes[log.sn] || '';
  let noteHtml;
  if(state.editingNote === log.sn){
    noteHtml = `<div class="note-edit" onclick="event.stopPropagation()">
      <textarea placeholder="输入备注…" id="noteTextarea-${log.sn}">${esc(noteText)}</textarea>
      <div class="note-btns">
        <button class="btn-save" onclick="event.stopPropagation();saveNote('${log.sn}')">保存</button>
        <button class="btn-cancel" onclick="event.stopPropagation();cancelNote()">取消</button>
      </div>
    </div>`;
  } else if(noteText){
    noteHtml = `<div class="note-display" onclick="event.stopPropagation();editNote('${log.sn}')">
      <span class="note-text">📝 ${highlight(noteText, kw, fuzzy)}</span>
      <span class="note-del" onclick="event.stopPropagation();deleteNote('${log.sn}')" title="删除备注">🗑️</span>
    </div>`;
  } else {
    noteHtml = `<span class="note-empty" onclick="event.stopPropagation();editNote('${log.sn}')">+ 添加备注</span>`;
  }
  // [2026-08-22] 冲突暂存区入口：该 SN 有待上传的本地备注时，显示"上传备注"行
  if(state.pendingNotes[log.sn] !== undefined){
    noteHtml += `<div class="note-pending" onclick="event.stopPropagation()">
      <span class="note-pending-text">📤 本地暂存：${esc(state.pendingNotes[log.sn] || '（空）')}</span>
      <button class="note-pending-btn" onclick="event.stopPropagation();openUploadConfirm('${log.sn}')">上传备注</button>
      <span class="note-pending-del" onclick="event.stopPropagation();discardPendingNote('${log.sn}')" title="丢弃本地暂存">🗑️</span>
    </div>`;
  }

  // [2026-08-24 OUTBOUND] 出库记录按钮（与备注并列；✓N = 已存档张数，元信息零图片流量）
  const obRec = state.outboundArchive[log.sn];
  const obBtnHtml = `<button class="ob-btn${obRec ? ' has-record' : ''}" ` +
    `onclick="event.stopPropagation();openOutboundModal('${log.sn}', '${encodeURIComponent(log.fileModel || '')}')" ` +
    `title="设备出库状态拍照记录${obRec ? '（已存 ' + obRec.count + ' 张）' : ''}">📦 出库记录${obRec ? ' ✓' + obRec.count : ''}</button>`;

  // 匹配片段（搜索时显示）
  let snippetHtml = '';
  if(kw){
    const snippet = findMatchSnippet(log, kw, fuzzy);
    if(snippet) snippetHtml = `<div class="match-snippet" onclick="event.stopPropagation()">${highlight(snippet, kw, fuzzy)}</div>`;
  }

  // 展开详情
  let detailHtml = '';
  if(expanded){
    detailHtml = renderCardDetail(log);
  }

  // 官网驱动按钮（根据 BIOS 厂商和序列号跳转品牌驱动页面）
  let driverHtml = '';
  const bios = hw.bios;
  if(bios && bios.serialNumber && bios.manufacturer){
    const mfr = bios.manufacturer.toLowerCase();
    const sn = bios.serialNumber.trim();
    let driverUrl = '';
    if(mfr.includes('dell')){
      driverUrl = `https://www.dell.com/support/product-details/zh-cn/servicetag/${sn}/drivers`;
    } else if(mfr.includes('lenovo')){
      driverUrl = `https://newsupport.lenovo.com.cn/driveList.html?fromsource=driveList&selname=${sn}`;
    }
    if(driverUrl){
      driverHtml = `<a class="btn-mini" href="${esc(driverUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="前往品牌官网下载驱动">🔧 官网驱动</a>`;
    }
  }

  return `<div class="log-card ${expanded?'expanded':''}" data-status="${log.overallResult}" data-id="${log.id}" onclick="toggleCardExpand('${log.id}')">
    <div class="card-top">${topParts.join('')}</div>
    <div class="feature-summary">${featHtml}</div>
    <div class="card-meta">${metaItems.join('')}</div>
    ${snippetHtml}
    <div class="card-bottom">
      <div class="note-area">${noteHtml}${obBtnHtml}</div>
      <div class="card-actions">
        ${driverHtml}
        ${expanded ? `<button class="btn-mini" onclick="event.stopPropagation();toggleCardExpand('${log.id}')">收起详情</button>` : ''}
      </div>
    </div>
    ${detailHtml}
  </div>`;
}

// 格式化系统综合调试的日志行（将单行拆为多行，增强可读性）
function formatSystemDebugLine(line){
  const markers = [
    { key:'OOBE', label:'系统环境状态' },
    { key:'T.bat', label:'快速创建用户脚本' },
    { key:'License', label:'系统许可证状态' },
    { key:'Password', label:'开机密码状态' },
    { key:'MAS', label:'激活工具运行状态' },
    { key:'磁盘初始化', label:'磁盘初始化' },
    { key:'Rename', label:'盘符重命名' },
    // [2026-09-15 v2.3] 清除使用痕迹（LDTools v2.7.3 新增，排在系统调试最后一步）
    { key:'清除痕迹', label:'清除使用痕迹' },
  ];

  // 未命中系统综合调试关键字段时保持原样
  const hasMarker = markers.some(m => line.indexOf(m.key + ':') !== -1);
  if(!hasMarker) return line;

  const hits = [];
  markers.forEach(m => {
    const idx = line.indexOf(m.key + ':');
    if(idx !== -1) hits.push({ ...m, idx });
  });

  // 按出现位置排序，保留原始顺序
  hits.sort((a,b) => a.idx - b.idx);

  const parts = [];
  for(let i = 0; i < hits.length; i++){
    const h = hits[i];
    const valueStart = h.idx + h.key.length + 1;
    const valueEnd = i < hits.length - 1 ? hits[i+1].idx : line.length;
    const value = line.substring(valueStart, valueEnd).trim();
    parts.push(`${h.label} ${h.key}:${value}`);
  }

  return parts.join('\n');
}

// 子任务状态 → 显示标签 & 颜色类（与 RESULT_META 语义一致）
const SUBTASK_STATUS_META = {
  success: { label:'成功', cls:'success' },
  failed:  { label:'失败', cls:'failed' },
  partial: { label:'部分', cls:'partial' },
  skipped: { label:'跳过', cls:'skipped' },
};

// 格式化子任务耗时：>=1s 显示 "X.Xs"，否则 "XXXms"
function fmtSubTaskDur(ms){
  if(!ms || ms <= 0) return '';
  return ms >= 1000 ? (ms/1000).toFixed(1).replace(/\.0$/,'') + 's' : Math.round(ms) + 'ms';
}

// [2026-09-10 v2.2] 分钟数 → "X小时Y分"（电池剩余 / 充满时间展示；≤0 视为无值）
function fmtMinutes(m){
  if(!m || m <= 0) return '';
  const hh = Math.floor(m/60), mm = m%60;
  if(hh > 0) return mm > 0 ? hh + '小时' + mm + '分' : hh + '小时';
  return mm + '分';
}

// [2026-09-10 v2.2] 电池信息 → 展示片段
// 搜索全文索引 / 搜索命中片段 / 详情气泡三处共用，保证口径一致；
// 约定：数值 -1 为"未知/不适用"（容量类为 0），一律不展示而非按 0 显示
function batterySegments(b){
  if(!b) return [];
  const segs = [];
  if(b.status) segs.push(b.status);
  if(b.chargePercent >= 0) segs.push('电量 ' + b.chargePercent + '%');
  if(b.healthPercent >= 0) segs.push('健康度 ' + b.healthPercent + '%');
  const manu = [b.manufacturer, b.chemistry].filter(s => s && String(s).trim()).join('·');
  if(manu) segs.push(manu);
  if(b.designCapacity > 0 || b.fullChargeCapacity > 0)
    segs.push((b.designCapacity || 0) + '/' + (b.fullChargeCapacity || 0) + ' mWh');
  if(b.estimatedRunTimeMinutes > 0)    segs.push('剩余 ' + fmtMinutes(b.estimatedRunTimeMinutes));
  if(b.estimatedFullChargeMinutes > 0) segs.push('充满还需 ' + fmtMinutes(b.estimatedFullChargeMinutes));
  return segs;
}

// 渲染子任务明细（V2.4+ 结构：key/status/before/after/detail/durationMs）
// featureId：所属功能 ID，用于按功能定制明细渲染（当前仅 5=音频测试 走标签化）
function renderSubTasks(subTasks, kw, fuzzy, featureId){
  if(!subTasks || subTasks.length === 0) return '';
  const h = highlight; // 简写

  // 头部统计：成功 N · 失败 N · 跳过 N · 部分 N
  const count = {};
  subTasks.forEach(t => { const s = t.status || 'skipped'; count[s] = (count[s]||0) + 1; });
  const statText = Object.keys(count).map(s => {
    const meta = SUBTASK_STATUS_META[s];
    return (meta ? meta.label : s) + ' ' + count[s];
  }).join(' · ');

  let html = '<div class="detail-subtasks">';
  html += `<div class="detail-subtask-head">执行明细 <span class="st-count">${esc(statText)}</span></div>`;

  subTasks.forEach(t => {
    const st = t.status || 'skipped';
    const meta = SUBTASK_STATUS_META[st] || { label: st, cls: 'skipped' };
    const dur = fmtSubTaskDur(t.durationMs);

    html += `<div class="detail-subtask-row">`;
    html += `<span class="status-dot ${meta.cls}"></span>`;
    html += `<span class="detail-subtask-key">${h(t.key || '', kw, fuzzy)}</span>`;
    html += `<span class="detail-subtask-status">${esc(meta.label)}</span>`;
    if(dur) html += `<span class="detail-subtask-dur">${dur}</span>`;
    html += `</div>`;

    // 变更行：仅当 before 非空且非 "-" 且与 after 不同才显示
    const before = (t.before || '').trim();
    const after  = (t.after || '').trim();
    if(before && before !== '-' && before !== after){
      html += `<div class="detail-subtask-change"><span class="ch-before">${h(before, kw, fuzzy)}</span><span class="ch-arrow">→</span><span class="ch-after">${h(after || '-', kw, fuzzy)}</span></div>`;
    } else if(after && after !== '-'){
      // 仅有 after 时，在变更行显示一次
      html += `<div class="detail-subtask-change"><span class="ch-after">${h(after, kw, fuzzy)}</span></div>`;
    }

    // 补充说明行
    if(t.detail && t.detail.trim()){
      const dt = t.detail.trim();
      // [2026-09-10 v2.2] 音频测试（featureId=5）的 detail 为 "键: 值 · 键: 值" 结构，
      // 拆成小标签展示更醒目；其余情况（含整句失败原因）保持原样一行
      const segs = (featureId === 5 && dt.indexOf(' · ') >= 0)
        ? dt.split(' · ').map(s => s.trim()).filter(Boolean)
        : null;
      if(segs && segs.length > 1){
        html += `<div class="detail-subtask-chips">` +
          segs.map(s => `<span class="st-chip">${h(s, kw, fuzzy)}</span>`).join('') +
          `</div>`;
      } else {
        html += `<div class="detail-subtask-detail">${h(dt, kw, fuzzy)}</div>`;
      }
    }
  });

  html += '</div>';
  return html;
}

// 判断某次执行记录是否命中搜索关键词（用于历史执行折叠区自动展开）
function execMatchesKw(e, kw, fuzzy){
  if(!kw || !e) return false;
  const texts = [];
  (e.consoleLogs || []).forEach(l => texts.push(l));
  (e.configsBefore || []).forEach(c => texts.push(c.key + '=' + c.value));
  (e.configsAfter || []).forEach(c => texts.push(c.key + '=' + c.value));
  (e.subTasks || []).forEach(t => {
    texts.push(t.key || '');
    if(t.before) texts.push(t.before);
    if(t.after)  texts.push(t.after);
    if(t.detail) texts.push(t.detail);
  });
  if(e.timestamp) texts.push(e.timestamp);
  // 统一匹配：任一文本块内全部关键词命中，即认为该执行记录命中（用于历史执行自动展开）
  return texts.some(t => matchUnified(t, kw));
}

// 渲染单次执行记录的正文（子任务明细 + 控制台日志 + 变更配置），供最新执行与历史执行复用
function renderExecBody(e, featureId, kw, fuzzy, autoOpenConsole){
  const h = highlight; // 简写
  let html = '';

  // 子任务明细（V2.4+ 结构化记录，旧日志无此字段自动跳过）
  if(e.subTasks && e.subTasks.length > 0){
    html += renderSubTasks(e.subTasks, kw, fuzzy, featureId);
  }

  // 控制台日志（系统综合调试做可读性格式化）
  // 当 subTasks 存在时，原文收纳为可展开的"控制台执行日志"，避免与结构化明细重复展示
  if(e.consoleLogs && e.consoleLogs.length > 0){
    const isSysDebug = featureId === 3;
    const hasSubTasks = e.subTasks && e.subTasks.length > 0;
    const logContent = e.consoleLogs.map(line=>{
      const out = isSysDebug ? formatSystemDebugLine(line) : line;
      return h(out, kw, fuzzy);
    }).join('\n');
    if(hasSubTasks){
      html += `<details class="detail-console-collapse"${autoOpenConsole ? ' open' : ''}><summary><span class="exec-toggle">▶</span><span>控制台执行日志</span></summary><div class="detail-feature-logs">${logContent}</div></details>`;
    } else {
      html += '<div class="detail-feature-logs">' + logContent + '</div>';
    }
  }

  // 变更前后配置（受开关控制，默认关闭）
  const hasBefore = e.configsBefore && e.configsBefore.length > 0;
  const hasAfter = e.configsAfter && e.configsAfter.length > 0;
  if(state.showConfigs && (hasBefore || hasAfter)){
    html += '<div class="detail-feature-configs">';
    if(hasBefore){
      html += '<div style="color:var(--text-light);font-weight:600;margin-bottom:2px;">变更前</div>';
      e.configsBefore.forEach(c=>{
        html += `<div class="detail-config-row"><span class="detail-config-key">${h(c.key, kw, fuzzy)}</span><span class="detail-config-val">${h(c.value, kw, fuzzy)}</span></div>`;
      });
    }
    if(hasAfter){
      if(hasBefore) html += '<div style="color:var(--text-light);font-weight:600;margin-top:4px;margin-bottom:2px;">变更后</div>';
      else html += '<div style="color:var(--text-light);font-weight:600;margin-bottom:2px;">配置</div>';
      e.configsAfter.forEach(c=>{
        html += `<div class="detail-config-row"><span class="detail-config-key">${h(c.key, kw, fuzzy)}</span><span class="detail-config-val">${h(c.value, kw, fuzzy)}</span></div>`;
      });
    }
    html += '</div>';
  }

  return html;
}

// 渲染卡片展开详情（气泡布局，纵向堆叠）
function renderCardDetail(log){
  const kw = state.searchTerm;
  const fuzzy = state.fuzzy;
  const hw = log.rawData.hardware || {};
  const lic = log.rawData.license || {};
  const meta = log.rawData.meta || {};
  const features = log.rawData.features || [];
  const h = highlight; // 简写

  // 气泡生成器
  function bubble(label, value, mono){
    const cls = mono ? 'bubble-value mono' : 'bubble-value';
    return `<div class="bubble"><span class="bubble-label">${h(label, kw, fuzzy)}</span><span class="${cls}">${h(value, kw, fuzzy)}</span></div>`;
  }

  let html = '<div class="card-detail" onclick="event.stopPropagation()">';

  // ===== 硬件信息 =====
  html += '<div class="detail-section"><div class="detail-section-title">🖥️ 硬件信息</div><div class="bubble-list">';
  html += bubble('设备型号', log.fileModel || hw.hostModel || '');
  const cpuParts = [hw.cpuName || ''].filter(Boolean);
  if(hw.cpuCores) cpuParts.push(hw.cpuCores);
  if(hw.cpuMaxSpeed) cpuParts.push(hw.cpuMaxSpeed);
  if(cpuParts.length > 0) html += bubble('CPU', cpuParts.join(' | '));
  // 内存
  if(Array.isArray(hw.memory)){
    hw.memory.forEach((m,i)=>{
      const pn = (m.partNumber||'').trim();
      html += bubble('内存条'+(i+1), `${m.capacityGB||'?'}GB | ${m.manufacturer||''} | ${pn} | ${m.speed||''}MHz`, true);
    });
  }
  // 主板
  if(hw.motherboard){
    const sn = (hw.motherboard.serialNumber||'').trim();
    html += bubble('主板', `${hw.motherboard.manufacturer||''} | ${hw.motherboard.product||''}${sn?' | SN: '+sn:''}`);
  }
  // BIOS
  if(hw.bios){
    const sn = (hw.bios.serialNumber||'').trim();
    html += bubble('BIOS', `${hw.bios.name||''} | ${hw.bios.version||''} | ${hw.bios.manufacturer||''}${sn?' | SN: '+sn:''}`);
  }
  // 磁盘
  if(Array.isArray(hw.disks)){
    hw.disks.forEach((d,i)=>{
      const sn = (d.serialNumber||'').trim();
      html += bubble('磁盘'+(i+1), `${d.sizeGB||'?'}GB | ${d.model||''} | ${d.partitions||''}${sn?' | SN: '+sn:''}`, true);
    });
  }
  // 显卡
  if(Array.isArray(hw.gpus)){
    hw.gpus.forEach((g,i)=>{
      html += bubble('显卡'+(i+1), `${g.name||''} | 显存:${g.adapterRAM_GB||0}GB | 驱动:${g.driverVersion||''}`);
    });
  }
  // 网卡（过滤蓝牙 PAN 伪网卡）
  if(Array.isArray(hw.networkAdapters)){
    filterNetAdapters(hw.networkAdapters).forEach((n,i)=>{
      html += bubble('网卡'+(i+1), `${n.name||''} | MAC:${n.macAddress||''}${n.linkSpeed ? ' | 速率:' + n.linkSpeed : ''}`, true);
    });
  }
  // 蓝牙
  if(Array.isArray(hw.bluetooths) && hw.bluetooths.length){
    hw.bluetooths.forEach((b,i)=>{
      const meta = [];
      if(b.driverVersion) meta.push('驱动:'+b.driverVersion);
      if(b.driverDate)    meta.push(b.driverDate);
      if(b.manufacturer)  meta.push(b.manufacturer);
      const parts = [b.name||''];
      if(meta.length) parts.push(meta.join(' | '));
      if(b.status)   parts.push(b.status);
      html += bubble('蓝牙'+(i+1), parts.join(' | '), true);
    });
  }
  // 电池（[2026-09-10 v2.2] 新增；与 LDTools 硬件概览同分区同口径，无电池机型整块不渲染）
  if(Array.isArray(hw.batteries) && hw.batteries.length){
    hw.batteries.forEach((b,i)=>{
      const segs = batterySegments(b);
      if(segs.length) html += bubble('电池'+(i+1), segs.join(' | '), true);
    });
  }
  html += '</div></div>';

  // ===== 系统信息 =====
  html += '<div class="detail-section"><div class="detail-section-title">💻 系统信息</div><div class="bubble-list">';
  html += bubble('Windows版本', hw.windowsVersion || '');
  html += bubble('Windows密码', hw.windowsPassword || 'N/A');
  html += bubble('许可证状态', hw.windowsLicenseStatus || '');
  html += bubble('OOBE状态', hw.oobeStatus || '');
  if(hw.scanTimestamp) html += bubble('扫描时间', hw.scanTimestamp, true);
  // 镜像历史机型（[2026-09-16 v2.5] 新增；[2026-09-17] 句式改为「该镜像曾由 {日期} 历史机型 {机型} 构成」，
  // 纯文本无序号、不进搜索索引；无该字段的历史日志自动跳过）
  if(Array.isArray(hw.imageHistory) && hw.imageHistory.length){
    hw.imageHistory.forEach((it)=>{
      if(it.model) html += bubble('该镜像曾由', `${it.date||'?'} 历史机型 ${it.model} 构成`);
    });
  }
  html += '</div></div>';

  // ===== 联想在线信息 =====
  if(hw.lenovoInfo){
    const li = hw.lenovoInfo;
    html += '<div class="detail-section"><div class="detail-section-title">🏢 联想在线信息</div><div class="bubble-list">';
    html += bubble('主机序列号', li.machineNo || '', true);
    html += bubble('官方型号', li.productModel || '');
    if(li.productLine) html += bubble('产品线', li.productLine);
    html += bubble('出厂配置', li.machineName || '');
    html += bubble('出厂日期', li.productDate || '');
    html += bubble('出库日期', li.scanDate || '');
    // 保修状态
    if(li.warrantyRemainingDays > 0){
      html += bubble('保修剩余', `剩余 ${li.warrantyRemainingDays} 天`);
    } else {
      html += bubble('保修状态', '已过期');
    }
    if(li.error) html += bubble('查询错误', li.error);
    html += '</div></div>';
  }

  // ===== 许可证信息 =====
  html += '<div class="detail-section"><div class="detail-section-title">🔑 许可证信息</div><div class="bubble-list">';
  html += bubble('用户', lic.userName || '');
  // 工具盘（仅显示型号+容量）
  if(Array.isArray(hw.removableDisks) && hw.removableDisks.length > 0){
    hw.removableDisks.forEach((d,i)=>{
      html += bubble('工具盘'+(i+1), `${d.model||''} | ${d.sizeGB||'?'}GB`, true);
    });
  }
  html += bubble('签发时间', lic.issuedAtUtc || '', true);
  html += bubble('到期时间', lic.expiryAtUtc || '', true);
  html += '</div></div>';

  // ===== 功能执行日志 =====
  html += '<div class="detail-section"><div class="detail-section-title">📋 功能执行日志</div>';
  features.forEach(f=>{
    const execs = f.executions || [];
    const last = execs[execs.length-1] || { result:'skipped' };
    const rMeta = RESULT_META[last.result] || RESULT_META.skipped;
    const def = FEATURE_DEFS.find(d=>d.id===f.featureId);
    const name = def ? def.name : (f.featureName || '功能'+f.featureId);
    const colorVar = last.result === 'success' ? 'var(--success)' :
                     last.result === 'failed' ? 'var(--failed)' :
                     last.result === 'partial' ? 'var(--partial)' : 'var(--skipped)';

    html += '<div class="detail-feature">';
    const badge = execs.length > 1 ? ` <span class="exec-badge">共${execs.length}次</span>` : '';
    html += `<div class="detail-feature-header"><span>${h(name, kw, fuzzy)}</span>${badge} <span class="feat-result-ico" style="color:${colorVar}">${rMeta.ico} ${rMeta.label}</span><span style="color:var(--text-light);font-size:.68rem;margin-left:auto">${last.timestamp || ''}</span></div>`;

    // 最新执行（默认展开）
    html += renderExecBody(last, f.featureId, kw, fuzzy, execMatchesKw(last, kw, fuzzy));

    // 历史执行（合并日志后产生多条，倒序折叠；搜索命中自动展开）
    for(let i = execs.length - 2; i >= 0; i--){
      const e = execs[i];
      const eMeta = RESULT_META[e.result] || RESULT_META.skipped;
      const eColor = e.result === 'success' ? 'var(--success)' :
                     e.result === 'failed' ? 'var(--failed)' :
                     e.result === 'partial' ? 'var(--partial)' : 'var(--skipped)';
      const openAttr = execMatchesKw(e, kw, fuzzy) ? ' open' : '';
      html += `<details class="exec-history"${openAttr}>`;
      html += `<summary><span class="exec-toggle">▶</span><span>历史执行 · 第${i+1}次</span> <span class="exec-result-ico" style="color:${eColor}">${eMeta.ico} ${eMeta.label}</span><span style="margin-left:auto;font-size:.66rem;">${e.timestamp || ''}</span></summary>`;
      html += `<div class="exec-body">${renderExecBody(e, f.featureId, kw, fuzzy, execMatchesKw(e, kw, fuzzy))}</div>`;
      html += `</details>`;
    }

    html += '</div>'; // close detail-feature
  });
  html += '</div>'; // close detail-section

  html += '</div>'; // close card-detail
  return html;
}

// 日期 → 友好标签（最近三天显示"今天/昨天/前天" + 小字日期）
function formatDayLabel(dateStr){
  const today = new Date();
  const todayStr = fmtDate(today);
  const yesterdayStr = fmtDate(new Date(today.getTime() - 86400000));
  const beforeYesterdayStr = fmtDate(new Date(today.getTime() - 2 * 86400000));
  const md = dateStr.slice(5); // MM-DD
  if(dateStr === todayStr) return `今天 <span class="day-date-sub">${md}</span>`;
  if(dateStr === yesterdayStr) return `昨天 <span class="day-date-sub">${md}</span>`;
  if(dateStr === beforeYesterdayStr) return `前天 <span class="day-date-sub">${md}</span>`;
  return dateStr;
}

// 渲染日期分组视图（默认模式——无限滚动）
function renderDateGroups(logs){
  // 按日期分组
  const groups = {};
  logs.forEach(l=>{
    if(!groups[l.uploadDateStr]) groups[l.uploadDateStr] = [];
    groups[l.uploadDateStr].push(l);
  });
  // 所有有数据的日期（倒序：最新在前）
  const allDates = Object.keys(groups).sort((a,b)=> b.localeCompare(a));
  state.allDateKeys = allDates;

  if(allDates.length === 0){
    return `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">当前条件下没有日志</div></div>`;
  }

  // 只渲染前 loadedDateCount 个日期
  const visibleCount = Math.min(state.loadedDateCount, allDates.length);
  const dates = allDates.slice(0, visibleCount);

  let html = '';
  dates.forEach(date=>{
    const items = groups[date];
    const collapsed = state.collapsedGroups.has(date);
    html += `<div class="day-group">
      <div class="day-group-header ${collapsed?'collapsed':''}" onclick="toggleGroup('${date}')">
        <span class="arrow">▼</span>
        <span class="day-group-title">${formatDayLabel(date)}</span>
        <span class="day-group-count">${items.length} 条</span>
      </div>
      <div class="day-group-content ${collapsed?'hidden':''}">
        ${items.map(renderCard).join('')}
      </div>
    </div>`;
  });

  // 底部加载区域
  const remaining = allDates.length - visibleCount;
  if(remaining > 0){
    // 用"正在加载更多"区域本身作为哨兵，避免多余的 hidden div 在视口内反复触发
    html += `<div class="load-more-area" id="loadMoreSentinel">
      <span class="load-more-dot"></span>
      <span class="load-more-dot"></span>
      <span class="load-more-dot"></span>
      <span>正在加载更多...</span>
    </div>`;
  } else if(allDates.length > DATE_PAGE_SIZE){
    // 全部加载完毕，且数据超过1页 → 显示"已加载全部"
    html += `<div class="load-more-area load-more-done">— 已加载全部 ${allDates.length} 天 —</div>`;
  }

  return html;
}

// 渲染搜索结果视图
function renderSearchResults(logs, keyword){
  const matched = logs.filter(l=>matchLog(l.fullContent, keyword));
  if(matched.length === 0){
    return `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">未找到匹配"${esc(keyword)}"的日志</div></div>`;
  }
  const dateRange = `${state.dateStart} ~ ${state.dateEnd}`;
  return `<div class="day-group">
    <div class="search-group-header">
      <div class="search-group-title">搜索结果 · <span class="kw">"${esc(keyword)}"</span></div>
      <div class="search-subtitle">${dateRange} · 匹配 ${matched.length} 条 · 统一匹配（空格分隔多词 AND）</div>
    </div>
    <div class="day-group-content">
      ${matched.map(renderCard).join('')}

}

function render(){
  // 1. 先按日期范围过滤
  let filtered = state.logs.filter(l=>{
    return l.uploadDateStr >= state.dateStart && l.uploadDateStr <= state.dateEnd;
  });
  // 2. 按状态过滤
  if(state.statusFilter !== 'all'){
    filtered = filtered.filter(l=>l.overallResult === state.statusFilter);
  }

  const kw = state.searchTerm.trim();
  if(kw){
    // 搜索模式：折叠所有日期分组，显示搜索结果
    logListEl.innerHTML = renderSearchResults(filtered, kw);
    const matched = filtered.filter(l=>matchLog(l.fullContent, kw));
    renderStats(matched.length, state.logs.length);
    // 搜索模式断开无限滚动监听
    disconnectInfiniteScroll();
  } else {
    // 默认模式：按日期分组（无限滚动）
    // 非加载更多触发的 render → 重置分页
    if(!_isLoadingMore){ state.loadedDateCount = DATE_PAGE_SIZE; }
    logListEl.innerHTML = renderDateGroups(filtered);
    renderStats(filtered.length, state.logs.length);
    // 渲染完成后建立哨兵监听
    setupInfiniteScroll();
  }
}

// ========== 无限滚动逻辑 ==========
let _isLoadingMore = false;
let _infiniteScrollObserver = null;

/** 断开旧的 IntersectionObserver */
function disconnectInfiniteScroll(){
  if(_infiniteScrollObserver){
    _infiniteScrollObserver.disconnect();
    _infiniteScrollObserver = null;
  }
}

/** 加载下一批日期分组 */
function loadMoreDates(){
  if(_isLoadingMore) return;
  const nextCount = Math.min(state.loadedDateCount + DATE_PAGE_SIZE, state.allDateKeys.length);
  if(nextCount === state.loadedDateCount) return; // 无变化，忽略
  _isLoadingMore = true;
  state.loadedDateCount = nextCount;
  render();
  _isLoadingMore = false;

  // 全部加载完成后弹出气泡提醒
  if(state.loadedDateCount >= state.allDateKeys.length){
    showAllLoadedToast();
  }
}

/** 弹出"已全部加载"气泡（右下角，3.5s 自动消失） */
let _toastTimer = null;
function showAllLoadedToast(){
  const el = document.getElementById('allLoadedToast');
  if(!el) return;
  // 防抖：上次还没消失，重置计时器
  if(_toastTimer){ clearTimeout(_toastTimer); }
  el.classList.add('show');
  _toastTimer = setTimeout(()=>{
    el.classList.remove('show');
    _toastTimer = null;
  }, 3500);
}

/** 建立无限滚动 IntersectionObserver，监听底部"正在加载更多"区域 */
function setupInfiniteScroll(){
  disconnectInfiniteScroll();
  const sentinel = document.getElementById('loadMoreSentinel');
  if(!sentinel) return; // 数据不足一页，无需监听

  _infiniteScrollObserver = new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting){
      loadMoreDates();
    }
  }, { rootMargin: '0px 0px 120px 0px', threshold: 0 });

  _infiniteScrollObserver.observe(sentinel);
}

/* ==================== 日期范围：三段式滚轮 + 确认制 + 动态30天 ==================== */
const SPAN_LIMIT = 30;   // 单边调节时另一端跟随的跨度（天）

// 当月最大天数（y:年, m:1-12）
function monthMaxDay(y, m){
  return new Date(y, m, 0).getDate();
}
// (y,m,d) → 合法日期字符串，d 超出当月时 clamp 到月末（如 2月30 → 2月28）
function safeDateStr(y, m, d){
  const day = Math.min(Math.max(d, 1), monthMaxDay(y, m));
  return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
// 滚轮改变某段：dateStr + unit('year'|'month'|'day') + delta(±1) → 新日期字符串
function shiftSeg(dateStr, unit, delta){
  const d = parseDate(dateStr);
  if(!d) return dateStr;
  let y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  if(unit === 'year'){
    y += delta;
  } else if(unit === 'month'){
    let nm = m + delta;
    while(nm < 1){ nm += 12; y -= 1; }
    while(nm > 12){ nm -= 12; y += 1; }
    m = nm;
  } else { // day：交给 Date 处理进位
    const nd = new Date(d.getTime());
    nd.setDate(nd.getDate() + delta);
    return fmtDate(nd);
  }
  return safeDateStr(y, m, day);
}
// 日期字符串 ± n 天
function addDays(dateStr, n){
  const d = parseDate(dateStr);
  if(!d) return dateStr;
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}
// clamp 到数据范围 [dataMinDate, dataMaxDate]
function clampToDataRange(dateStr){
  if(!dateStr) return dateStr;
  if(state.dataMinDate && dateStr < state.dataMinDate) return state.dataMinDate;
  if(state.dataMaxDate && dateStr > state.dataMaxDate) return state.dataMaxDate;
  return dateStr;
}
// 从三段 input 读取日期字符串
function readSegDate(field){
  const g = document.querySelector(`.date-seg-group[data-field="${field}"]`);
  if(!g) return '';
  const y = parseInt(g.querySelector('[data-unit="year"]').value, 10);
  const m = parseInt(g.querySelector('[data-unit="month"]').value, 10);
  const d = parseInt(g.querySelector('[data-unit="day"]').value, 10);
  if(!y || !m || !d) return '';
  return safeDateStr(y, m, d);
}
// 把日期字符串写入三段 input
function writeSegDate(field, dateStr){
  const g = document.querySelector(`.date-seg-group[data-field="${field}"]`);
  if(!g) return;
  const d = parseDate(dateStr);
  if(!d) return;
  g.querySelector('[data-unit="year"]').value = d.getFullYear();
  g.querySelector('[data-unit="month"]').value = String(d.getMonth()+1).padStart(2,'0');
  g.querySelector('[data-unit="day"]').value = String(d.getDate()).padStart(2,'0');
}

// 核心：用户手动修改了某端日期 → 联动（不触发查询，仅联动 + 显【应用】按钮）
//   link30=ON ：改一端，另一端自动 ±30天 跟随
//   link30=OFF：两端独立，但保持至少 1 天范围（改端碰到另一端时，推开另一端 ±1天）
function applyManualChange(which){
  let v = readSegDate(which);
  if(!v){ // 输入非法（空/非数字），恢复原值不动
    writeSegDate(which, which === 'start' ? state.dateStart : state.dateEnd);
    return;
  }
  const oldVal = which === 'start' ? state.dateStart : state.dateEnd;
  v = clampToDataRange(v);

  const other = which === 'start' ? 'end' : 'start';
  let otherVal = which === 'start' ? state.dateEnd : state.dateStart;
  let otherChanged = false;

  if(state.link30){
    // 30天联动：另一端 = v ± 30
    otherVal = which === 'start' ? addDays(v, SPAN_LIMIT) : addDays(v, -SPAN_LIMIT);
    otherVal = clampToDataRange(otherVal);
    if(which === 'start' && otherVal < v) otherVal = v;
    if(which === 'end' && otherVal > v) otherVal = v;
    otherChanged = true;
  } else {
    // link30=OFF：两端独立，但保持至少 1 天范围
    if(which === 'start' && v >= otherVal){
      // 起始 ≥ 结束 → 推结束 = 起始 + 1
      let newEnd = clampToDataRange(addDays(v, 1));
      if(newEnd <= v){
        // 结束无法 +1（数据上界）→ 起始后退到 结束 - 1
        v = clampToDataRange(addDays(otherVal, -1));
        newEnd = otherVal;
      }
      otherVal = newEnd;
      otherChanged = true;
    } else if(which === 'end' && v <= otherVal){
      // 结束 ≤ 起始 → 推起始 = 结束 - 1
      let newStart = clampToDataRange(addDays(v, -1));
      if(newStart >= v){
        // 起始无法 -1（数据下界）→ 结束前进到 起始 + 1
        v = clampToDataRange(addDays(otherVal, 1));
        newStart = otherVal;
      }
      otherVal = newStart;
      otherChanged = true;
    }
    // else: 范围 ≥ 1 天，两端都接受
  }

  // 写入最终值
  writeSegDate(which, v);
  if(which === 'start') state.dateStart = v; else state.dateEnd = v;
  if(otherChanged){
    if(other === 'start') state.dateStart = otherVal; else state.dateEnd = otherVal;
    writeSegDate(other, otherVal);
  }

  // 值未变化不触发（避免 blur 误触发）
  if(v === oldVal && !otherChanged && !state.dateDirty) return;

  markDateDirty(true);
  updateSpanHint();
}

// 跨度/数据量过大提示（非阻塞）
// [2026-08-22] 改版：口径B（待处理数 = 范围内尚未加载的文件数）+ 触发条件叠加文件数阈值
// 回滚标记：如需恢复旧版，删除 PENDING_FILE_LIMIT/countPendingFiles，并将下方函数体还原为：
//   if(!state.link30 && state.dateStart && state.dateEnd){
//     const days = Math.round((parseDate(state.dateEnd) - parseDate(state.dateStart)) / 86400000);
//     if(days > SPAN_LIMIT){
//       hint.textContent = `⚠ 当前跨度 ${days} 天，查询可能较慢`;
//       hint.style.display = 'block';
//       return;
//     }
//   }
//   hint.style.display = 'none';
const PENDING_FILE_LIMIT = 50;  // 待处理文件数阈值：范围内未加载文件超过此数也触发提示

// 统计 [dateStart, dateEnd] 范围内尚未加载的文件数（与 decryptFilesInDateRange 的筛选逻辑同源）
// 返回 -1 表示 manifest 未加载，无法统计
function countPendingFiles(){
  if(!Array.isArray(state.manifestFiles) || !state.fileDateMap) return -1;
  return state.manifestFiles.filter(fname=>{
    if(state.decryptedSet.has(fname)) return false;
    const ds = state.fileDateMap[fname];
    return ds && ds >= state.dateStart && ds <= state.dateEnd;
  }).length;
}

function updateSpanHint(){
  const hint = document.getElementById('dateSpanHint');
  if(!hint) return;
  // [2026-08-22 修复] 移除旧版 !state.link30 门槛：文件数触发不依赖联动开关状态
  // （跨度分支在 link30=ON 时恒 ≤30 天本就不会触发，门槛冗余且挡死文件数分支）
  // 回滚：恢复为 if(!state.link30 && state.dateStart && state.dateEnd){
  if(state.dateStart && state.dateEnd){
    const days = Math.round((parseDate(state.dateEnd) - parseDate(state.dateStart)) / 86400000);
    const pending = countPendingFiles();
    // 触发条件（叠加）：跨度 > SPAN_LIMIT 或 待处理文件数 > PENDING_FILE_LIMIT
    if(days > SPAN_LIMIT || pending > PENDING_FILE_LIMIT){
      const pendingText = pending < 0 ? '统计中' : pending;
      hint.textContent = `⚠ 注意：筛选时间范围 ${days} 天，数据量较大！预处理数据量 ${pendingText} 个`;
      hint.style.display = 'block';
      return;
    }
  }
  hint.style.display = 'none';
}

}

function applyDateRange(){

window.applyDateRange = applyDateRange;

// 绑定三段式组件事件（滚轮 / 手动输入 / ↑↓键）
function setupSegGroup(field){
  const group = document.querySelector(`.date-seg-group[data-field="${field}"]`);
  if(!group) return;
  group.querySelectorAll('.seg').forEach(seg=>{
    // 滚轮：改变悬停的该段（编辑中不触发，避免打断输入）
    seg.addEventListener('wheel', e=>{
      e.preventDefault();
      if(seg.dataset.editing === '1') return;
      const delta = e.deltaY < 0 ? 1 : -1;
      let nv = shiftSeg(readSegDate(field), seg.dataset.unit, delta);
      nv = clampToDataRange(nv);
      writeSegDate(field, nv);
      applyManualChange(field);
    }, { passive:false });
    // 只允许输入数字
    seg.addEventListener('input', ()=>{ seg.value = seg.value.replace(/[^\d]/g,''); });
    // 聚焦进入编辑
    seg.addEventListener('focus', ()=>{ seg.dataset.editing = '1'; seg.select(); });
    // 失焦提交：值有变化才规整+联动（避免仅聚焦未改时误触发跟随）
    seg.addEventListener('blur', ()=>{
      seg.dataset.editing = '0';
      const newVal = readSegDate(field);
      const oldVal = field === 'start' ? state.dateStart : state.dateEnd;
      if(newVal !== oldVal) applyManualChange(field);
    });
    // 键盘：回车提交，↑↓ 微调该段
    seg.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); seg.blur(); }
      else if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
        e.preventDefault();
        if(seg.dataset.editing === '1') return;
        const delta = e.key === 'ArrowUp' ? 1 : -1;
        let nv = shiftSeg(readSegDate(field), seg.dataset.unit, delta);
        nv = clampToDataRange(nv);
        writeSegDate(field, nv);
        applyManualChange(field);
      }
    });
  });
}

/** 统一的备注提交：成功更新本地；409 弹冲突气泡；网络失败写 localStorage 兜底 */
async function pushNote(sn, text, isDelete){
  const base = state.noteMeta[sn] || null;   // 乐观锁基准（加载时看到的 updatedAt）
  try{
    const resp = await apiFetch('/api/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sn, text, baseUpdatedAt: base, force: false })
    });
    const data = await resp.json();
    if(resp.status === 409 && data.current !== undefined){
      // 冲突：弹红色警告气泡，保留编辑现场
      showNoteConflict(sn, text, isDelete, data.current);
      return;
    }
    if(!resp.ok || data.error){
      showNoteToast('❌', data.message || '备注保存失败', 'err');
      return;
    }
    // 成功：更新本地状态 + localStorage 备份
    if(text){ state.notes[sn] = text; state.noteMeta[sn] = data.updatedAt; }
    else { delete state.notes[sn]; delete state.noteMeta[sn]; }
    // 冲突暂存区里同 SN 的待上传备注若与本次提交一致（如用户主动重存），一并清掉
    if(state.pendingNotes[sn] !== undefined && state.pendingNotes[sn] === text){
      delete state.pendingNotes[sn]; persistPendingNotes();
    }
    persistNotesLocal();
    state.editingNote = null;
    render();
    showNoteToast(isDelete ? '🗑️' : '📝', isDelete ? '备注已删除' : '备注已保存', 'ok');
  }catch(err){
    // 网络失败：写 localStorage 兜底（下次联网时数据不丢，但不自动同步）
    if(text) state.notes[sn] = text; else delete state.notes[sn];
    persistNotesLocal();
    state.editingNote = null;
    render();
    showNoteToast('⚠', '服务器不可达，备注已暂存本地（下次保存时重新同步）', 'err');
  }
}

// ---- 冲突气泡 ----
// 编辑场景（isDelete=false）：气泡展示"服务器版本"+"覆盖/暂不修改"
// 删除场景（isDelete=true）：气泡展示"服务器已被他人修改"+"确认删除/取消"
function showNoteConflict(sn, localText, isDelete, current){
  _noteConflictCtx = { sn, localText, isDelete, current: current || null };
  const snEl = document.getElementById('noteConflictSn');
  const curEl = document.getElementById('noteConflictCurrent');
  const titleEl = document.getElementById('noteConflictTitle');
  const btnOverwrite = document.getElementById('noteConflictOverwrite');
  const btnKeep = document.getElementById('noteConflictKeep');
  snEl.textContent = 'SN: ' + sn;
  if(isDelete){
    titleEl.textContent = '⚠ 确认删除？';
    if(current && current.text){
      curEl.innerHTML = '<span class="label">服务器上的备注已被他人修改为：</span>' +
        '<b>' + esc(current.text) + '</b>' +
        '<span class="subtime">（' + esc(current.updatedAt || '') + '）</span>' +
        '<div class="hint">是否仍要删除？</div>';
    }else{
      curEl.innerHTML = '<span class="label">服务器上的备注已被删除</span>' +
        '<span class="subtime">（可能他人操作）</span>' +
        '<div class="hint">是否仍要删除（无实际效果）？</div>';
    }
    btnOverwrite.textContent = '确认删除';
    btnKeep.textContent = '取消';
  }else{
    titleEl.textContent = '备注冲突';
    if(current && current.text){
      curEl.innerHTML = '<span class="label">服务器现有备注（' + esc(current.updatedAt || '') + '）：</span>' +
        '<b>' + esc(current.text) + '</b>';
    }else{
      curEl.innerHTML = '<span class="label">服务器备注已不存在</span>（可能被他人删除）';
    }
    btnOverwrite.textContent = '覆盖';
    btnKeep.textContent = '暂不修改（存本地）';
  }
  document.getElementById('noteConflict').style.display = 'flex';
}

// ---- localStorage 辅助 ----
/** localStorage 主备份（服务端为主数据源，这里仅做离线兜底） */
function persistNotesLocal(){
  try{ localStorage.setItem(NOTES_KEY, JSON.stringify(state.notes)); }catch(e){ console.warn('备注本地备份失败', e); }
}
/** 冲突暂存区持久化 */
function persistPendingNotes(){
  try{ localStorage.setItem(PENDING_NOTES_KEY, JSON.stringify(state.pendingNotes)); }catch(e){ console.warn('暂存备注保存失败', e); }
}
/** 从 localStorage 恢复暂存区（每次启动都执行） */
function loadPendingNotes(){
  try{
    const raw = localStorage.getItem(PENDING_NOTES_KEY);
    if(raw) state.pendingNotes = JSON.parse(raw) || {};
  }catch(e){ state.pendingNotes = {}; }
}

/**
 * 从服务端加载备注（主数据源），含一次性迁移：
 *   1. GET /api/notes → 填充 state.notes / state.noteMeta
 *   2. 迁移：localStorage 旧备注中服务器没有的 SN → force 上传（旧 localStorage 数据无冲突概念）
 *   3. 失败 → 回退 localStorage（旧版行为，离线可用）
 */
async function loadNotesRemote(){
  loadPendingNotes();
  try{
    const resp = await apiFetch('/api/notes');
    const data = await resp.json();
    if(!resp.ok || data.error) throw new Error(data.message || '读取失败');
    const remote = data.notes || {};
    state.notes = {}; state.noteMeta = {};
    for(const sn in remote){
      state.notes[sn] = remote[sn].text;
      state.noteMeta[sn] = remote[sn].updatedAt || '';
    }
    // ---- 一次性迁移：仅当服务端 firstBoot=true（notes.json 不存在，首次部署）时才迁移 ----
    // [2026-08-22] 修复"备注复活"bug（方案B）：
    //   旧版（上午方案A）判断 `Object.keys(state.notes).length === 0`——只防住"服务端有数据但漏一条"，
    //   防不住"服务端被全删（如唯一的备注被删）→ state.notes 整体为空 → 进迁移 → 旧快照复活"。
    //   现改由服务端 firstBoot 字段（notes.json 磁盘不存在时才 true）触发迁移，彻底封死复活路径。
    //   回滚：把条件换回 `Object.keys(state.notes).length === 0` 即还原上午方案A。
    if(data.firstBoot === true){
      let local = {};
      try{ local = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}') || {}; }catch(e){}
      let migrated = 0;
      for(const sn in local){
        if(local[sn]){
          try{
            const r = await apiFetch('/api/notes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sn, text: local[sn], force: true })
            });
            const d = await r.json();
            if(r.ok && !d.error){
              state.notes[sn] = local[sn];
              state.noteMeta[sn] = d.updatedAt || '';
              migrated++;
            }
          }catch(e){ /* 单条迁移失败不阻塞启动 */ }
        }
      }
      if(migrated > 0){
        console.log(`✓ 已迁移 ${migrated} 条本地备注到服务器`);
        persistNotesLocal();
      }
    }
  }catch(err){
    // 服务端不可达 → 回退 localStorage（旧版行为）
    console.warn('服务端备注加载失败，回退 localStorage:', err.message);
    try{
      const raw = localStorage.getItem(NOTES_KEY);
      if(raw){
        const local = JSON.parse(raw) || {};
        state.notes = local; state.noteMeta = {};
      }
    }catch(e){ state.notes = {}; }
  }
}

     <div class="ob-modal-btns">
       <button class="ob-btn-save" id="obSaveBtn" onclick="obUploadSubmit()">保存</button>
       <button class="ob-btn-plain" onclick="closeOutboundModal()">取消</button>
     </div>`;
  ctx.files = {};
}

/** 点选图片：复用隐藏的 file input（capture=environment 移动端直调后摄） */
window.obPickFile = function(type){
  if(_obUploading) return;
  const input = document.getElementById('obFileInput');
  input.value = '';
  input.onchange = () => obFileChosen(type, input.files && input.files[0]);
  input.click();
};

function obFileChosen(type, file){
  if(!file || !_obCtx) return;
  // 客户端软校验（服务端仍强制魔数嗅探 + 35MB 上限）
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
    showNoteToast('⚠', '仅支持 JPEG / PNG / WebP 图片', 'err');
    return;
  }
  if(file.size > 35 * 1024 * 1024){
    showNoteToast('⚠', '图片超过 35MB 上限（当前 ' + (file.size / 1024 / 1024).toFixed(1) + 'MB）', 'err');
    return;
  }
  _obCtx.files[type] = file;
  // FileReader 本地预览（零上传流量，上传前即所见）
  const reader = new FileReader();
  reader.onload = (e) => {
    const thumb = document.getElementById('obThumb_' + type);
    if(thumb) thumb.innerHTML = '<img src="' + e.target.result + '">';
    const info = document.getElementById('obInfo_' + type);
    if(info) info.innerHTML =
      '<div class="fname">✅ ' + esc(file.name) + '</div>' +
      '<div class="fhint">' + Math.round(file.size / 1024) + ' KB · 点击虚线框可重新选择</div>';
    const drop = document.getElementById('obDrop_' + type);
    if(drop) drop.classList.add('selected');
  };
  reader.readAsDataURL(file);
}

/** 上传提交：XHR multipart（fetch 不支持上传进度） */
window.obUploadSubmit = function(){
  const ctx = _obCtx;
  if(!ctx || _obUploading) return;
  const host = ctx.files.host, part = ctx.files.part;
  if(!host && !part){
    showNoteToast('⚠', '请至少选择一张图片（主机记录必传，配件记录可选）', 'err');
    return;
  }
  const fd = new FormData();
  fd.append('sn', ctx.sn);
  if(host) fd.append('hostFile', host, host.name);
  if(part) fd.append('partFile', part, part.name);

  const xhr = new XMLHttpRequest();
  const token = getAuthToken();
  _obUploading = true;
  const saveBtn = document.getElementById('obSaveBtn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = '上传中…'; }
  document.getElementById('obProgressWrap').hidden = false;
  xhr.upload.onprogress = (e) => {
    if(!e.lengthComputable) return;
    const pct = Math.round(e.loaded * 100 / e.total);
    document.getElementById('obProgressBar').style.width = pct + '%';
    document.getElementById('obProgressText').textContent = pct + '%';
  };
  xhr.onload = () => {
    _obUploading = false;
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = '保存'; }
    let data = null;
    try{ data = JSON.parse(xhr.responseText); }catch(_){}
    if(xhr.status === 200 && data && data.ok){
      // 更新摘要缓存 + 重渲染卡片徽章；重新以查看模式打开（刷新明细）
      state.outboundArchive[ctx.sn] = { folder: data.folder, uploadedAt: data.uploadedAt,
                                   count: (data.files || []).length };
      render();
      showNoteToast('📦', '出库记录已保存（' + (data.files || []).length + ' 张）', 'ok');
      openOutboundModal(ctx.sn, encodeURIComponent(ctx.model || ''));
    }else{
      showNoteToast('❌', (data && data.message) || ('上传失败（HTTP ' + xhr.status + '）'), 'err');
      document.getElementById('obProgressWrap').hidden = true;
      document.getElementById('obProgressBar').style.width = '0%';
    }
  };
  xhr.onerror = () => {
    _obUploading = false;
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = '保存'; }
    showNoteToast('⚠', '网络错误，上传已中断', 'err');
  };
  xhr.open('POST', '/api/outbound-archive');
  if(token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
  xhr.send(fd);
};

// ---- 查看模式 ----
function obRenderViewMode(){
  const d = _obDetail;
  if(!d) return;
  document.getElementById('obModalTitle').textContent = obModalTitleOf(_obCtx ? _obCtx.model : '');
  const token = encodeURIComponent(getAuthToken() || '');
  const tagMap = { host: '主机记录', part: '配件记录', other: '其他' };
  const fmtSize = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
  const items = (d.files || []).map(f => {
    const url = f.url + '&token=' + token + '&v=' + encodeURIComponent(d.folder);
    const sha = (f.sha256 || '').slice(0, 16);
    return `<div class="ob-view-item" onclick="obViewImage('${esc(url)}')" title="点击查看原图大图">
      <div class="ob-view-tag">${tagMap[f.type] || esc(f.type)}</div>
      <img src="${esc(url)}" loading="lazy"
           onerror="this.outerHTML='<div class=&quot;ob-view-broken&quot;>⚠ 图片已失效（档案可能已被删除）<div class=&quot;ob-view-broken-meta&quot;>'+this.alt+'</div></div>'"
           alt="${tagMap[f.type] || '出库记录'}">
      <div class="ob-view-meta">${esc(f.name)} · ${fmtSize(f.size || 0)}${sha ? ' · SHA256: ' + esc(sha) + '…' : ''}</div>
    </div>`;
  }).join('');
  document.getElementById('obModalBody').innerHTML =
    `<div class="ob-view-info">上传时间：<b>${esc(d.uploadedAt || '')}</b><br>` +
    `档案夹：<b>${esc(d.folder)}</b> · 共 <b>${(d.files || []).length}</b> 张 · 点击图片查看原图</div>` +
    `<div class="ob-view-imgs">${items}</div>` +
    `<div class="ob-modal-btns">
       <button class="ob-btn-danger" onclick="obDeleteRecord()">删除记录</button>
       <button class="ob-btn-plain" onclick="obReupload()">重新上传</button>
     </div>`;
}

/** 大图查看层（按需加载原图） */
window.obViewImage = function(url){
  document.getElementById('obImgViewerImg').src = url;
  document.getElementById('obImgViewer').classList.remove('hidden');
};
window.closeObImageViewer = function(){
  document.getElementById('obImgViewer').classList.add('hidden');
  document.getElementById('obImgViewerImg').src = '';
};

/** 重新上传：二次确认 → 上传模式（覆盖 = 旧档永久删除，服务端原子保证） */
window.obReupload = function(){
  if(!_obCtx) return;
  if(!window.confirm('重新上传将覆盖当前档案（旧档案将被永久删除），确定继续？')) return;
  _obCtx.mode = 'upload';
  obRenderUploadMode();
};

/** 删除记录：confirm → DELETE → 永久删除（不可恢复） */
window.obDeleteRecord = async function(){
  const ctx = _obCtx;
  if(!ctx) return;
  if(!window.confirm('确定要删除该出库记录吗？\n（永久删除，不可恢复）')) return;
  try{
    const resp = await apiFetch('/api/outbound-archive?sn=' + encodeURIComponent(ctx.sn), { method: 'DELETE' });
    const data = await resp.json();
    if(!resp.ok || data.error){
      showNoteToast('❌', data.message || '删除失败', 'err');
      return;
    }
    delete state.outboundArchive[ctx.sn];
    render();
    showNoteToast('🗑️', '出库记录已删除', 'ok');
    closeOutboundModal();
  }catch(e){
    showNoteToast('⚠', '网络错误：' + e.message, 'err');
  }
};


/* ==================== 八、初始化 ==================== */

async function init(){
  await loadNotesRemote();   // [2026-08-22] 服务端备注加载（含一次性迁移 + 离线回退）
  // [2026-08-24 OUTBOUND] 必须 await：保证首次 render 拿到出库档案徽章数据
  // 否则 fire-and-forget 模式下，render() 会在摘要回来前先跑，徽章全显示无记录（历史 bugfix 2026-08-22）
  await loadOutboundArchive();
  // 兼容旧调用点（同步等待完成后调用无副作用）
  try{ await apiFetch('/api/refresh'); }catch(e){}

  // 从 FTP 服务器加载真实数据（服务端处理，内存缓存）
  try{
    showLoading('正在读取日志清单...');
    const ok = await loadManifest();
    if(ok){
      state.dataSource = 'real';
      // 默认日期范围：今天往前推 9 天，clamp 到数据范围
      const def = getDefaultDateRange();
      state.dateStart = def.start;
      state.dateEnd = def.end;
      updateDateInputs();
      resetDateState();
      updateDataSourceBadge();
      // 加载默认范围内的文件
      await decryptFilesInDateRange(state.dateStart, state.dateEnd);
      hideLoading();
      render();
      updateSpanHint();  // [2026-08-22] 加载完成后刷新待处理数提示

      // ---- 版本轮询：检测日志文件新增 ----
      // 记录页面加载时的版本基线
      try{
        const vi = await apiFetch('/api/version').then(r=>r.json());
        _logVersionBaseline = vi.version;
      }catch(_){}
      // 每 30 秒轮询一次，版本号 > 基线则弹出提醒
      setInterval(async ()=>{
        if(_logNotifyDismissed) return;
        try{
          const vi = await apiFetch('/api/version').then(r=>r.json());
          if(_logVersionBaseline !== null && vi.version > _logVersionBaseline){
            notifyLogChanged();
          }
        }catch(_){}
      }, 30000);
      // --------------------------------------------------

      return;
    } else {
      hideLoading();
      renderErrorState('未找到日志文件', 'ERR_EMPTY', 'FTP 服务器上没有 .json 日志文件');
      render();
      return;
    }
  }catch(err){
    console.warn('数据加载失败:', err);
    hideLoading();
    renderErrorState('服务器无法连接', err.code || 'ERR_UNKNOWN', err.message || '连接失败');
    render();
    return;
  }
}

// 不再直接启动 init()，改为由认证流程控制启动时机
// （DOMContentLoaded → 检查 token → 验证通过 → init() 或 显示登录遮罩）
</script>
