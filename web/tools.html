<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实用工具下载 - WSDI Tools</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d2991d;
            --muted: #8b949e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }
        .header .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2.2em;
            font-weight: 600;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle {
            color: var(--muted);
            margin-top: 8px;
            font-size: 1.1em;
        }
        .nav-back {
            text-align: center;
            margin: 20px 0;
        }
        .nav-back a {
            color: var(--accent);
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-back a:hover {
            background: var(--card);
            border-color: var(--accent);
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .stat-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 24px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: 600;
            color: var(--accent);
        }
        .stat-label {
            color: var(--muted);
            font-size: 0.9em;
        }
        .file-list {
            margin-top: 30px;
        }
        .file-list h2 {
            color: var(--text);
            margin-bottom: 16px;
            font-size: 1.3em;
        }
        .file-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            transition: all 0.2s;
        }
        .file-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .file-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #58a6ff33, #3fb95033);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 20px;
        }
        .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-name {
            color: var(--text);
            font-weight: 500;
            font-size: 1.05em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-meta {
            color: var(--muted);
            font-size: 0.85em;
            margin-top: 4px;
        }
        .file-download {
            background: var(--accent);
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .file-download:hover {
            background: #4c9aed;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .loading .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            padding: 40px 20px 30px;
            color: var(--muted);
            font-size: 0.9em;
        }
        @media (max-width: 600px) {
            .file-card {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .file-download {
                text-align: center;
            }
            .stats {
                gap: 10px;
            }
            .stat-item {
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="icon">🛠️</div>
        <h1>实用工具下载</h1>
        <div class="subtitle">常用软件、驱动工具、便携程序一键下载</div>
    </div>

    <div class="nav-back">
        <a href="/">← 返回首页</a>
    </div>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-value" id="stat-count">-</div>
            <div class="stat-label">个工具</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-size">-</div>
            <div class="stat-label">总大小</div>
        </div>
    </div>

    <div class="file-list">
        <h2>工具列表</h2>
        <div id="files-container">
            <div class="loading">
                <div class="spinner"></div>
                <div>正在从云端加载工具列表...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div>文件来自 Backblaze B2 对象存储 · 通过 Cloudflare 加速</div>
        <div style="margin-top: 6px;">WSDI Tools · 持续更新中</div>
    </div>
</div>

<script>
// 文件类型图标映射
function getFileIcon(filename, mimeType) {
    const name = filename.toLowerCase();
    if (name.endsWith('.zip') || name.endsWith('.7z') || name.endsWith('.rar')) return '🗜️';
    if (name.endsWith('.exe') || name.endsWith('.msi')) return '⚙️';
    if (name.endsWith('.iso')) return '💿';
    if (name.endsWith('.ps1')) return '📜';
    if (name.endsWith('.bat') || name.endsWith('.cmd')) return '📜';
    if (name.endsWith('.pdf')) return '📄';
    if (name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.gif') || name.endsWith('.webp')) return '🖼️';
    if (mimeType && mimeType.startsWith('image/')) return '🖼️';
    if (mimeType && mimeType.startsWith('video/')) return '🎬';
    if (mimeType && mimeType.startsWith('audio/')) return '🎵';
    return '📦';
}

// 文件大小格式化
function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

// 日期格式化
function formatDate(isoStr) {
    try {
        const d = new Date(isoStr);
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0');
    } catch { return ''; }
}

// 获取文件扩展名（去掉 tools/ 前缀后）
function getDisplayName(name) {
    // 去掉 tools/ 前缀
    return name.replace(/^tools\//, '');
}

async function loadTools() {
    try {
        const resp = await fetch('/api/tools');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        const container = document.getElementById('files-container');
        const statCount = document.getElementById('stat-count');
        const statSize = document.getElementById('stat-size');

        if (!data.files || data.files.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📦</div>
                    <div>暂无工具文件</div>
                    <div style="margin-top: 8px; font-size: 0.9em;">管理员可使用上传脚本添加工具</div>
                </div>
            `;
            statCount.textContent = '0';
            statSize.textContent = '0 MB';
            return;
        }

        // 按文件名排序
        data.files.sort((a, b) => a.name.localeCompare(b.name));

        statCount.textContent = data.files.length;
        statSize.textContent = formatSize(data.total_size || 0);

        container.innerHTML = data.files.map(f => {
            const display = getDisplayName(f.name);
            const icon = getFileIcon(f.name, f.mime_type);
            const size = formatSize(f.size);
            const date = formatDate(f.mod_time);
            const url = f.url;
            return `
                <div class="file-card">
                    <div class="file-icon">${icon}</div>
                    <div class="file-info">
                        <div class="file-name" title="${display}">${display}</div>
                        <div class="file-meta">${size}${date ? ' · ' + date : ''}</div>
                    </div>
                    <a class="file-download" href="${url}" target="_blank">下载</a>
                </div>
            `;
        }).join('');
    } catch (err) {
        const container = document.getElementById('files-container');
        container.innerHTML = `
            <div class="empty-state">
                <div class="icon">❌</div>
                <div>加载失败</div>
                <div style="margin-top: 8px; font-size: 0.9em; color: var(--red);">${err.message}</div>
            </div>
        `;
    }
}

loadTools();
</script>
</body>
</html>
